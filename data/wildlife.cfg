; The stork nests on roofs (see StorkNests): a nest is a heap of sticks on the ridge of some
; buildings, for good; the pair that lives in it, and the young, come and go with the date. All the
; days are of the year (spring is days 1 to 30, summer 31 to 60), and `_spread_days` is how many
; days later than the first a nest may be, seeded for each nest and year so they are not in step.
;   building_types         the buildings with a roof for a nest
;   nest_chance            of those, how many have a nest (0 to 1), seeded by where they stand
;   arrival_day            the pair flies in (early spring)
;   incubation_days        until the young hatch (late spring), after the arrival
;   fledging_days          until the young stand on the rim and flap (late summer), after hatching
;   first_leaves_days      until the first young leaves, after they stand on the rim
;   leaving_gap_days       between one young leaving and the next; the pair goes with the last
;   min_young, max_young   how many young a nest has
;   brood_guard_days       after hatching, one parent is always on the nest
;   trip_hours             a parent is on the nest or away to the meadows for this many hours at a time
;   trip_chance_pair       the chance that a parent is away in daylight while there are no young
;   trip_chance_brood      and while there are, when they must be fed
[stork_nest]
building_types=["kate", "longhouse", "hall_house", "barn"]
nest_chance=0.4
arrival_day=3
arrival_spread_days=5
incubation_days=14
incubation_spread_days=4
fledging_days=24
fledging_spread_days=2
first_leaves_days=2
leaving_gap_days=2
min_young=2
max_young=4
brood_guard_days=7
trip_hours=3
trip_chance_pair=0.15
trip_chance_brood=0.5
