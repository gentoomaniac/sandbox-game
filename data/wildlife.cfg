; Ambient wildlife: how many animals of each kind there are, and where and when. Hand-editable;
; read once when the game starts (see game/state/wildlife_rules.gd).
;
; An animal's kind is "active" to a degree from 0 to 1: the season factor times the weight of the
; part of the day, and 0 while the weather drives it into hiding. The most animals of a kind near
; the player is `cap` times that degree (rounded), and a missing one appears with a chance of
; `spawn_chance` per second times the degree.

[general]
; The dawn and the dusk last this long either side of sunrise and sunset, in minutes.
twilight_minutes=90
; The most animals of all kinds near the player.
max_total=12
; Animals appear in a ring around the view: not nearer to its edge than `spawn_inset_tiles` inside
; it, not farther than `spawn_margin_tiles` outside it, and never nearer to the player than
; `min_spawn_distance_tiles`. They vanish beyond `despawn_margin_tiles` outside the view.
spawn_inset_tiles=1.0
spawn_margin_tiles=4.0
despawn_margin_tiles=14.0
min_spawn_distance_tiles=2.0
; How often the spawner looks at the counts, in seconds.
tick_seconds=1.0
; The tidal mud is water to the animals while the tide stands above this (0 at low water, 1 at
; high water): nothing stands on it then, a gull swims and a tern dives there (see Tide).
flooded_tide=0.6

; Keys of every kind:
;   cap             the most near the player
;   spawn_chance    per second at full activity
;   terrains        the terrains it lives on (empty: anywhere, e.g. the sky)
;   trees_radius    it needs at least `min_trees` trees within this many tiles of the spot
;   min_trees
;   water_radius    it needs open water (a river, a pond, a ditch, the sea) within this many
;                   tiles of the spot (0: it doesn't): wet meadows
;   farm_radius     it needs farmland within this many tiles of the spot (0: it doesn't):
;                   tilled soil, a crop, a Knick, a fieldstone wall or a building
;   flowers_per_animal  it only lives at flowers in bloom: one of it for every this many
;                       tiles of them in and around the view (0: it needs no flowers)
;   season_factors  spring, summer, autumn, winter
;   phase_weights   day, dawn and dusk, night
;   rain_limit, fog_limit, storm_limit   it hides at this much rain, fog or storm (0 to 1)
;   alert_tiles     it looks up when the player is this near (0: never)
;   flee_tiles      it runs or flies off when the player is this near (0: never)
;
; Keys that only some kinds have (see WildlifeRules):
;   edge_radius     it needs a tree, a hedge (Knick) or open water within this many tiles
;   after_sunset_minutes  it is only about from the start of the dusk until this long after
;                   sunset, and the phase weights then only say how many
;   wind_limit      it hides at this much wind (0 to 1)
;   min_temperature it hides below this many degrees Celsius

