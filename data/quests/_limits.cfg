; How many quests there may be (see game/state/quests/quest_rules.gd). Every other *.cfg in this
; folder is one quest, and its file name is its id (see the header of fibre_for_beans.cfg); a file
; that starts with an underscore is none. Read once when the game starts.

; The quests of the villagers: `max_open` is the most that are posted or taken at once (the source
; of a quest counts its own), `per_day` the most that are posted on one game day, and a quest is not
; posted again for `repeat_after_days` after it was done or went away. `default_days` is how long
; a quest stays when its file has no `days`.
[villagers]
max_open=10
per_day=1
repeat_after_days=20
default_days=8

; The quests the player has taken, from all sources together; with the log full, taking another
; is refused.
[log]
quest_log_size=10
