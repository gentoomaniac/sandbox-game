; One quest. The file name is its id. Values are on one line, or in a list or dictionary.
;
; giver       "any" (default: a villager picked at random when it is posted) or a villager id of
;             data/villagers.cfg
; days        how long it stays from the day it is posted, 1 to 60 (default: `default_days` of
;             _limits.cfg)
; starter     true if it may be the quest of the first day: what it asks for lies about from the
;             start, and it may require nothing but the day and the season (default false)
; notice      the rough line of the notice board, at most 100 characters; {giver} is filled in
; dialogue    what the giver says to give it, one to six lines; turn_in what they say when it is done
; short       said when too little is brought; {have} and {count} are filled in (optional)
; objective   {"type": ...} and what that kind needs. The kinds are the scripts of
;             game/state/quests/objectives: bring has "item" and "count"; build has "object",
;             "count", "near" ("home") and "radius" (see wattle_for_the_garden.cfg)
; requires    a list of prerequisites, all must hold for it to be posted (optional). The kinds are
;             the scripts of game/state/quests/conditions: opinion ("at_least", "villager"), skill
;             ("skill", "at_least"), season ("seasons"), day ("at_least", "at_most") and quest_done
;             ("quest")
; reward      {"items": {item: count}, "opinion_steps": 1 or 2}, at least one of them
[quest]
giver="any"
days=8
starter=true
notice="Fibre is wanted for the bean rows. Go and see {giver}."
dialogue=["My bean rows sag, neighbour.", "Could you spare five fibre to bind them?"]
turn_in=["That will hold till the autumn.", "Take these, they are good seed."]
short="Not yet five, neighbour. {have} of {count}."
objective={"type": "bring", "item": "fibre", "count": 5}
reward={"items": {"turnip_seeds": 10}, "opinion_steps": 1}
