; Skills: the crafts the player gets better at by doing them (task 74). Hand-editable; read once
; when the game starts (see game/state/skill_rules.gd). The skills tab (K) lists them in the order
; of this file.
;
; [cap] and [gain] hold the rules all skills share. Every other section is a skill, named after
; its id (a recipe names it in `skill`, see recipes.cfg), with:
;   name         What the player reads.
;   description  One line about it, for its tooltip.

[cap]
; The most points one skill can have.
skill=100.0

[gain]
; The points one craft teaches while the skill is at the recipe's level ...
at_level=2.0
; ... less the further the skill is above it, down to nothing at this many points above: a recipe
; that far below the skill is trivial and teaches nothing.
trivial_above=40.0

[woodworking]
name="Woodworking"
description="Planks, furniture and clogs at the workbench."

[cooking]
name="Cooking"
description="Meals at the hearth or the campfire, bread at the oven."

[masonry]
name="Masonry"
description="Bricks, moulded at the workbench and fired in the kiln."
