; How the look of the world changes with the year and the weather. Hand-editable; read once when
; the game starts (see game/state/season_rules.gd, season_blend.gd and snow_cover.gd).

; Season blending. Foliage and grass do not change on one morning: around each boundary
; between two looks there is a window of days (first, last, as the day of the year, 1 to 120:
; spring 1-30, summer 31-60, autumn 61-90, winter 91-120). Every tile and every plant has a
; fixed random threshold in [0, 1) and has changed over once the share of the window that has
; passed (eased smoothly from 0 to 1) is above it, so the change spreads over the window, one
; tile or tree at a time. The looks in the order of the year: bare (winter without snow) ->
; spring -> summer -> autumn -> bare.
;
; Each window starts the day before its season, so on the season's first day about a sixth
; has changed, half on the second, five in six on the third and all on the fourth:
; Vector2(0, 4) eases through 0.16, 0.5, 0.84 and 1 on days 1 to 4.

[ground]
; Grass and the ground it grows on.
bare_to_spring=Vector2(0, 4)
spring_to_summer=Vector2(30, 34)
summer_to_autumn=Vector2(60, 64)
autumn_to_bare=Vector2(90, 94)

[ground_mix]
; The colour of the grass itself shifts smoothly through the year (fresh in spring, darker green
; in autumn and winter), with no tile or patch changing before another: the whole ground mixes
; from the colour of one season to the next over these windows (days of the year, first and
; last, eased smoothly). Between windows the colour holds. Wider than the windows of [ground],
; so the change is gentle.
bare_to_spring=Vector2(0, 12)
spring_to_summer=Vector2(26, 40)
summer_to_autumn=Vector2(56, 76)
autumn_to_bare=Vector2(84, 104)

[litter]
; Fallen leaves lie on top of the ground, more and more as the trees shed them. The amount is
; 0 (none) to 1 (as many as the trees have given): it grows from `from_day` to `full_day`,
; holds to `thins_day` and thins out to nothing by `gone_day` (rotted and swept away), as days
; of the year.
from_day=62
full_day=94
thins_day=100
gone_day=118

[foliage]
; Trees, bushes and ferns: the autumn colours come in tree by tree, the leaves drop tree by
; tree at the start of winter, and the trees leaf out tree by tree in spring.
bare_to_spring=Vector2(0, 4)
spring_to_summer=Vector2(30, 34)
summer_to_autumn=Vector2(60, 64)
autumn_to_bare=Vector2(90, 94)
; In spring a plant does not switch from bare to full leaves: it goes through buds and young
; leaves in even steps over this share of the bare_to_spring window, starting the later the
; higher its threshold. Keep it at least twice the biggest step of the share from one day to
; the next (0.34 for a window of 4 days), so no plant skips a step.
leaf_out_span=0.7

[snow]
; Snow cover is a number from 0 (bare ground) to 1 (everything white) that follows the
; weather minute by minute. A pixel of the ground shows snow while the cover its tile catches (see
; [cover]) is above the threshold of the pixel in the noise map (see game/state/ground_cover.gd),
; so a cover of 0.3 covers about three in ten pixels, in soft patches.
;
; Snowfall at full intensity adds this much cover per hour.
snowfall_per_hour=0.03
; Above 0 degrees Celsius the cover melts by this much per hour per degree ...
melt_per_degree_hour=0.007
; ... and by this many times as much again in full sunlight (half as much under half the sun).
sun_melt_gain=1.5
; At or below 0 degrees nothing melts. The cover is counted from this day of the year (it
; surely is 0 then) and is 0 from the first day of the next year, when the thaw is over.
counted_from_day=61
; The thaw of a moment, 0 to 1: none at 0 degrees, full at this temperature (counting full
; sunlight as the extra melt of `sun_melt_gain`). It decides how much the paths and the open
; ground lose of the cover before the sheltered places (see [cover]).
full_thaw_at_temperature=6.0

[frost]
; Frost, 0 to 1, grows as it gets colder below 0 degrees: none at 0, full at this temperature.
full_at_temperature=-6.0

[cover]
; Where the leaves, the frost and the snow lie thicker or thinner. Each tile has a few numbers
; (see game/state/ground_cover.gd), 0 to 1, that the view gives the ground shader: a share of
; the leaves, of the snow, of the melt and of the frost shelter. All lengths are in tiles.
;
; A tile this near a tree (the tree's own tiles count) is under its crown: the crown thins out
; to nothing at this distance.
crown_radius=2.5
; Leaves lie on open ground this much of what they do under a broadleaved tree ...
leaf_open=0.3
; ... and the leaves are this many times as thick on a field and on a worn path.
leaf_field=0.4
leaf_path=0.25
; Snow under a full crown lies this much less (0 as much, 1 none) ...
snow_under_crown=0.45
; ... in the lee of a building, up to this far east of it (the wind is a fixed westerly) this
; much less right behind it, fading out along the reach ...
snow_lee=0.5
lee_reach=3
; ... and on a worn path it catches this much of what open ground does (people tread it).
snow_path=0.55
; How much of the thaw a tile feels: open ground, a worn path and, under a full crown, this
; much less (it is shaded).
melt_open=0.5
melt_path=1.0
melt_under_crown=0.3
; A full thaw takes this much cover off a tile that feels all of it.
thaw_gain=0.6
; What stands on the ground (a tree, a bush, a stone, a roof) catches this many times the snow
; share of the ground it stands on, at most all: it is not under its own crown, and snow lies
; thicker on a branch or a roof than on the ground.
object_snow_gain=1.7
; Frost under a full crown lies this much less.
frost_under_crown=0.7
