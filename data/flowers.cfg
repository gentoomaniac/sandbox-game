; Where the meadow flowers grow: drifts of them over the green, every tunable number of their
; placement. Hand-editable; read once when the game starts (see game/state/flower_rules.gd).
; When each species blooms is in data/vegetation.cfg, [flowers]. The flowers are decorations:
; a look only, never under an object, none on tilled fields or water.
;
; Two slow noises over the world decide it. The drift noise (-1 to 1) gathers the flowers in
; drifts: a tile is in a drift where it is above `start`, and in its thick where it reaches
; `core`. The mix noise picks a tile's community: the species that grow together there and
; bloom one after another through the year. When several of them are in bloom, a tile shows
; the one furthest into its bloom, so they mix. So a drift is of one or two colours at a time
; and changes colour with the season.

[drifts]
; How large the drifts are and how large the stretches of one community: about 1 / frequency
; tiles across.
frequency=0.07
mix_frequency=0.03
start=-0.15
core=0.25
; Outside the drifts and at their very edge a lone flower still grows here and there: this
; share of the habitat's chance.
stray_share=0.06
; A tile in bloom shows a few plants in the outer part of a drift and the thick of the drift
; from this depth in (0 at the drift's edge, 1 where the noise reaches `core`).
thick_from=0.5
; But a tile shows a lone small plant while the density of its species is less than this above
; the tile's threshold: the first flowers of a species are small, and so are its last.
small_margin=0.12

; The habitats, each with:
;   chance       the chance of flowers on a tile in the thick of a drift (0 to 1)
;   communities  lists of species, each one a community
; Woods are grass in a forest: few flowers, those of the beech woods and their edges.

; Ordinary grass: pasture and meadow.
[grass]
chance=0.9
communities=[["dandelion", "buttercup", "knapweed"], ["daisy", "red_clover", "yarrow"], ["dandelion", "buttercup", "red_clover"], ["daisy", "white_clover", "knapweed"]]

; Lush grass: damp, fertile meadow.
[lush_grass]
chance=0.9
communities=[["cuckooflower", "buttercup", "meadowsweet"], ["dandelion", "red_clover", "meadowsweet"], ["daisy", "buttercup", "red_clover"]]

; Dry grass: the sandy Geest, heath in late summer.
[dry_grass]
chance=0.8
communities=[["daisy", "yarrow", "heather"], ["dandelion", "knapweed", "heather"], ["white_clover", "heather"]]

; The floodplain by the river: wet meadow.
[floodplain]
chance=0.85
communities=[["cuckooflower", "buttercup", "meadowsweet"], ["cuckooflower", "meadowsweet"]]

; Wetland: a few among the sedge.
[wetland]
chance=0.2
communities=[["cuckooflower", "meadowsweet"]]

[woods]
chance=0.15
communities=[["wood_anemone", "red_campion"], ["wood_anemone"]]
