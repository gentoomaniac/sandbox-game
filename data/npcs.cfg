; Villagers (NPCs): how they look, what they are called and how they go about their day.
; Hand-editable; read once when the game starts (see game/state/npc_rules.gd). Distances are in
; tiles, speeds in tiles per second, times in real seconds unless they say minutes.
;
; A villager keeps near its anchor: the yard in front of the door of the nearest building, or
; the nearest fireplace, as they were when it came into the world (else the spot where it came).
; By day it stands about and strolls; at night it stands still.

[behaviour]
; It never walks further than this from its anchor.
anchor_radius=6.0
; How far from where it comes into the world it looks for a building or a fireplace.
anchor_search=16.0
walk_speed=1.5
; [shortest, longest] standing still, and strolling.
idle_seconds=[2.0, 8.0]
walk_seconds=[1.0, 4.0]
; The chance that it strolls when it is done standing (else it stands a while more).
walk_chance=0.5
; It stops rather than walk closer than this to the player's feet.
personal_space=0.8
; After a chat it stands still this long before it goes on.
linger_seconds=6.0
; It stands still for the night from this many minutes after sunset to this many after
; sunrise (before it, if negative).
rest_minutes_after_sunset=30.0
up_minutes_after_sunrise=0.0

; How a villager is drawn and named. Each list is drawn from with equal chances, so a name given
; twice comes twice as often; "" is nothing in that slot. The looks are layer variants: the sheet
; assets/character/<slot>_<variant>.png and its portrait (see tools/art/villagers.py). A hair
; variant is <style>_<colour>, one of `hair_styles` with one of `hair_colours`.

[everyone]
skins=["0", "0", "fair", "fair", "tanned", "dark"]
hair_colours=["brown", "brown", "blond", "blond", "red", "grey", "black"]
feet=["clogs"]
surnames=["Hansen", "Jensen", "Petersen", "Paulsen", "Boysen", "Ketels", "Lorenzen", "Nissen", "Carstensen", "Brodersen", "Andresen", "Feddersen", "Jacobsen", "Momsen", "Hinrichsen"]

; North Frisian and Low German first names of the 18th century.
[male]
first_names=["Hinrich", "Jens", "Boy", "Momme", "Ocke", "Tete", "Knud", "Brar", "Harro", "Nahmen", "Arfst", "Lorenz", "Peter", "Claus", "Jacob", "Hans"]
hair_styles=["short", "short", "long", "tied", "tied"]
clothes=["1", "0", "0", "waistcoat_blue", "waistcoat_green", "waistcoat_brown", "waistcoat_black"]
legs=["0", "0", "breeches_leather", "breeches_black", "breeches_blue"]
aprons=[""]
coats=["", "", "", "jacket", "jacket_brown", "jacket_black"]
heads=["", "knitted_cap", "straw_hat", "felt_hat", "felt_hat"]

[female]
