; Villagers (NPCs): how they look, what they are called, who they are and how they go about
; their day. The villagers written by hand are in data/villagers.cfg; these tables make up the
; others.
; Hand-editable; read once when the game starts (see game/state/npc_rules.gd). Distances are in
; tiles, speeds in tiles per second, times in real seconds unless they say minutes.
;
; A villager keeps near its anchor: the yard in front of the door of the nearest building, or
; the nearest fireplace, as they were when it came into the world (else the spot where it came).
; By day it stands about and strolls; at night it stands still.

[behaviour]
; It never walks further than this from its anchor.
anchor_radius=6.0
; How far from where it comes into the world it looks for a building or a fireplace.
anchor_search=16.0
walk_speed=1.5
; [shortest, longest] standing still, and strolling.
idle_seconds=[2.0, 8.0]
walk_seconds=[1.0, 4.0]
; The chance that it strolls when it is done standing (else it stands a while more).
walk_chance=0.5
; It stops rather than walk closer than this to the player's feet.
personal_space=0.8
; After a chat it stands still this long before it goes on.
linger_seconds=6.0
; It stands still for the night from this many minutes after sunset to this many after
; sunrise (before it, if negative).
rest_minutes_after_sunset=30.0
up_minutes_after_sunrise=0.0

; How a villager is drawn and named. Each list is drawn from with equal chances, so a name given
; twice comes twice as often; "" is nothing in that slot. The looks are layer variants: the sheet
; assets/character/<slot>_<variant>.png and its portrait (see tools/art/villagers.py). A hair
; variant is <style>_<colour>, one of `hair_styles` with one of `hair_colours`.

[everyone]
skins=["0", "0", "fair", "fair", "tanned", "dark"]
hair_colours=["brown", "brown", "blond", "blond", "red", "grey", "black"]
feet=["clogs"]
; None of the surnames of the village sheet (data/village.cfg, which names the families of
; data/villagers.cfg), so that a made-up villager is never taken for one of their kin.
surnames=["Jensen", "Petersen", "Lorenzen", "Nissen", "Carstensen", "Brodersen", "Andresen", "Hinrichsen", "Johannsen", "Christiansen", "Clausen", "Asmussen", "Ipsen", "Lassen", "Matthiesen", "Sönnichsen"]

; North Frisian and Low German first names of the 18th century.
[male]
; Their trade with their day (where they are when), and their family, as the prompt tells them
; (see data/npc_talk.cfg); {spouse} is a first name of the other sex with the villager's surname.
trades=[
	["a farmhand", "Works on a farm in the Koog from dawn to dusk: the cattle, the ditches, the hay. Free on Sunday afternoons."],
	["a fisherman", "Out on the creeks with the tide, early or late as it falls; mends nets ashore."],
	["a carter", "On the road to Husum with his cart most days, back by dusk; sees to the horse at night."],
	["a thatcher", "Up on someone's roof from spring to autumn; cuts reed in the winter."],
	["a shepherd", "With the sheep on the heath of the Geest or the salt meadows all day; home at dusk."],
	["a peat cutter", "Cuts peat in the bog on the Geest in spring, stacks it to dry in summer and carts it in autumn."],
	["a cooper", "Makes and mends barrels and butter tubs in his workshop all day."],
	["a dyke worker", "Digs, carries clay and lays sods on the dyke from spring to autumn; clears ditches in winter."],
	["a day labourer", "Works wherever there is work, haymaking, threshing or ditching, paid by the day."],
	["a tailor", "Goes from farm to farm with his needles, sewing for his board and a few Schilling."],
]
families=["Married to {spouse}, with three children.", "A widower; his only son is at sea.", "Unmarried; he lives with his old mother.", "Newly married to {spouse}.", "Married to {spouse}; their baby was born at Candlemas.", "Unmarried; he lodges with the family he works for."]
first_names=["Hinrich", "Jens", "Boy", "Momme", "Ocke", "Tete", "Knud", "Brar", "Harro", "Nahmen", "Arfst", "Lorenz", "Peter", "Claus", "Jacob", "Hans"]
hair_styles=["short", "short", "long", "tied", "tied"]
clothes=["1", "0", "0", "waistcoat_blue", "waistcoat_green", "waistcoat_brown", "waistcoat_black"]
legs=["0", "0", "breeches_leather", "breeches_black", "breeches_blue"]
aprons=[""]
coats=["", "", "", "jacket", "jacket_brown", "jacket_black"]
heads=["", "knitted_cap", "knitted_cap_white", "straw_hat", "felt_hat", "felt_hat", "tricorne"]

[female]
trades=[
	["a farmer's wife", "Milks at dawn and at dusk; the dairy, the hens and the house in between."],
	["a dairymaid", "Milks at dawn and at dusk on a farm in the Koog, churns and scrubs the pails, and sleeps above the cows."],
	["a spinner", "Spins wool and flax at her wheel by the window all day, and sells the yarn to the weaver."],
	["a fisherman's wife", "Cleans and sells her husband's catch, mends nets and keeps the house by the dyke."],
	["a washerwoman", "Washes for the bigger farms at the ditch and the copper, a different farm each day of the week."],
	["a weaver", "At her loom from morning till the light goes."],
	["a seamstress", "Sews and mends for the farms, at home or in their kitchens."],
]
families=["Married to {spouse}, with two small children.", "A widow; her husband was lost at sea.", "Unmarried; she keeps house for her brother.", "Married to {spouse}; their eldest daughter is in service in Husum.", "Betrothed to {spouse}; they marry at Michaelmas.", "Unmarried; she is in service at a farm on the Geest."]
first_names=["Antje", "Elke", "Inken", "Kerrin", "Wiebke", "Ingke", "Marret", "Gondel", "Ose", "Frauke", "Gesche", "Telse", "Moiken", "Anna", "Catharina", "Margaretha"]
hair_styles=["bun", "bun", "plaits"]
clothes=["bodice_red", "bodice_blue", "bodice_green", "bodice_black"]
legs=["skirt_red", "skirt_blue", "skirt_brown", "skirt_black", "skirt_heather"]
aprons=["", "white", "white", "blue", "striped"]
coats=["", "", "shawl_red", "shawl_cream", "shawl_heather"]
heads=["coif", "coif", "coif", "scarf_red", "scarf_blue", "straw_hat"]

; What a villager made up from these tables is like besides trade and family, each drawn with
; equal chances: an age between the youngest and the oldest, a personality, a worry, and the rest
; of their sheet as data/villagers.cfg describes it. They live in the village of data/village.cfg,
; but on its edges (their `homes`), and know its families only by sight: they are not kin to
; them. A speech is its manner with sample lines in that voice; like the habits, it is written so
; that it holds in any language the villager is spoken to in, without English words to say.
[background]
ages=[18, 70]
personalities=["Warm and talkative; likes a joke.", "Quiet and careful with words.", "Pious and a little stern.", "Cheerful and nosy; loves a bit of gossip.", "Gruff, but kind underneath.", "Thrifty and always counting.", "Restless and curious about the world beyond Husum.", "Melancholy, but warms to talk of the old days.", "Proud, and touchy about their good name.", "Easy-going; nothing hurries them."]
worries=["Worries that the dyke won't hold the winter storm tides.", "Worries about the price of grain at the Husum market.", "Worries about a cow that won't eat.", "Worries that the hay won't dry in time.", "Worries about the rent due at Martinmas.", "Worries about the sheep on the salt marsh when the tide is high.", "Worries that the cattle plague will reach the Koog.", "Worries that the winter's peat won't last."]
homes=[
	"A small farm on the Geest, half an hour from the church; the family has been there for generations but keeps to itself.",
	"A day labourer's hut along the dyke road; came from Eiderstedt two years ago.",
	"A rented room at an outlying farm on the edge of the Geest; came from the islands this spring.",
	"A cottage by the peat bog on the Geest; came from near Tönning after a fire.",
	"A small house on the road to Husum, the last one of the parish.",
]
speeches=[
	["Talks a lot and fast, jumping from one thing to the next, and loves to pass on news.", ["Did you hear? The Deichgraf comes for the Deichschau, and the Deichvogt is in a sweat!", "Rain tomorrow, my knee says. And the pastor's cow got out again."]],
	["Few words, plain and slow; agrees with a nod or a grunt.", ["Hm. Could be.", "Hard work, the ditches. Always is."]],
	["Polite and careful, as with a stranger; a little formal, with thanks and blessings.", ["God's greeting to you. A fine morning, praise be.", "Thank you kindly, but I must get on."]],
	["Grumbles about everything, but with a twinkle.", ["Prices up, wages down, and the wind always in my face.", "A newcomer, are you? Well, someone has to be."]],
	["Shy and quiet; answers briefly and looks away.", ["Oh. Yes. Good day.", "I don't know much about that, sorry."]],
	["Blunt and loud; says what they think and laughs hard.", ["Ha! You won't last a winter here dressed like that.", "The Krug's beer is thin, but it's wet."]],
]
likes=["Likes a pipe in the evening and a good fire. Dislikes the tax clerk and wet feet.", "Likes the Biike fires and dancing. Dislikes sermons that go on.", "Likes animals better than people. Dislikes strangers who ask too many questions.", "Likes a good bargain at the Husum market. Dislikes waste.", "Likes hymns and a clean house. Dislikes drink and cards.", "Likes tales of the sea and the whalers. Dislikes the mud of the marsh."]
wants=["To save enough for a cow of their own.", "To get through the year without debt.", "A dry harvest and a quiet winter.", "To be taken on at a bigger farm in the Koog at Martinmas.", "To learn to read the hymn book properly.", "To be accepted in the village, which takes years."]
habits=["Always comes back to the weather.", "Puffs on a clay pipe between words.", "Answers a question with a question.", "Sighs before speaking.", "Counts on their fingers when money comes up.", "Hums a hymn under their breath.", "Scratches their chin and takes their time before answering.", "Laughs at their own jokes before the end."]
avoids=["Won't talk about where they lived before.", "Knows nothing of the sea or fishing.", "Won't talk about money.", "Knows nothing of letters or books.", "Won't talk about the pastor or the church."]
secrets=["Owes the Krug for a winter's beer.", "Left a sweetheart behind where they came from.", "Cannot read, and hides it.", "Took peat from the Amt's bog without leave.", "Is saving to leave for Hamburg.", "Once spent a night in the Husum lock-up."]
