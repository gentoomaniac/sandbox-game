; Sounds: what each sound event plays and how. Hand-editable; read once when the game starts
; (see game/state/sound_rules.gd). tools/audio/generate.py writes the files of every event;
; to use a recording instead, point an event's `files` to it. No code changes.
;
; Every section is a sound event, named as in SoundRules.EVENTS, and has all of:
;   files       The variants, as res:// paths of audio files that exist. One is picked at random
;               each time the event plays. A loop (*_loop) carries its loop points in the file.
;   volume_db   Added to the file's own level, in dB. 0 keeps it; the generator already balances
;               the events against each other.
;   pitch_min,
;   pitch_max   Each play gets a random pitch factor between these (1 is the file as it is, 1.05
;               a little higher). Equal values play it unchanged.
;   bus         "effects", "ambience" or "ui": the volume slider that governs it (see
;               game/scenes/audio_service.gd). The muffle inside a building covers the ambience.

