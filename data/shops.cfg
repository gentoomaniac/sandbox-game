; What the shopkeepers sell and take: one [shop.<id>] for each, with a section for each good under
; it. Read once when the game starts (see game/state/shop_rules.gd, which also reports what is
; wrong with the file). The plan is design/economy/shop.md.
;
; There is no money yet: a shop is barter by value. Everything has a `worth` in Pfennig, the unit of
; the economy draft (design/economy/README.md); the worths are here until money has a
; data/prices.cfg of its own. The shopkeeper sells at `sell_percent` of the worth, rounded up, and
; takes at `take_percent`, rounded down. A deal is fair when what the player gives is worth at
; least as much as what they get.
;
; Keys of [shop.<id>]:
; - keeper: the villager of data/villagers.cfg who keeps it (the shop is open while their entry
;   of the day is `keep_shop`, see data/activities.cfg).
; - sell_percent, take_percent: whole numbers above 0 (percent of a worth).
;
; Keys of [shop.<id>.sells.<item>], what she sells (an item of the game):
; - worth: Pfennig, from 1.
; - max: the most she has at once, and what a new shop starts with.
; - best (optional, true or false): one of her best wares, sold only to those whose friendship has her
;   `best_wares` benefit (data/friendship.cfg [benefits]). None is marked yet.
; - restock: how many come back each day, up to `max` (not above it). The stock is worked out when
;   the shop is looked at, from the days since it was last looked at, so a long absence adds up.
;
; Keys of [shop.<id>.takes.<item>], what she takes in trade (an item of the game):
; - worth: Pfennig, from 1.
; - room: how many she takes in a day. It is back to its full number every day.
;
; An item is sold or taken, not both. More seeds are more `sells` sections and need no code.
;
; The seeds (design/economy/shop.md, #11): she sells the seeds of every crop all year round, in or
; out of season (planting is not gated by the calendar, the weather decides, and a seed keeps). A
; seed is worth 2 to 5 Pfennig, so the stock of any one seed costs less than what a day's room for
; her raw goods (eggs, berries, fibre, reeds, hay, logs, clay) pays: the farm can always start again
; after a lost harvest. One seed item plants one tile.

