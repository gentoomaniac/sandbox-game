; Buildings: what the hammer can place. Hand-editable; read once when the game starts (see
; game/state/building_rules.gd), which BuildingTypes serves to the rest of the game. A new
; building is a new section here plus its pictures and interior map; no code. The hammer's
; Q and E pick the buildings in the order of this file.
;
; Every section is named after the building (its type id, which a save stores) and has all of:
;   name           What the player reads, e.g. "Kate".
;   footprint      Tiles covered, as Vector2i(width, height).
;   door_offset    The tile of the footprint with the door, relative to its top left tile, as
;                  Vector2i(x, y). It is on the bottom row, and the tile below it has to be
;                  walkable for a building to be placed.
;   sprite         Its picture (drawn in tools/art/buildings.py). It is as wide as the footprint
;                  and its bottom edge is the footprint's bottom edge; the roof rises above it.
;                  The looks of the seasons are found by name (see SeasonalArt.HOUSE_LOOKS):
;                  <sprite>_autumn.png, <sprite>_snow.png, e.g. kate_snow.png.
;   sprite_lit     The same with lit windows, shown at night (kate_lit.png, kate_lit_snow.png).
;   interior_map   The Tiled map of the inside (see InteriorLoader), or "" for a building that
;                  has none (the bell frame): its door_offset is then only the tile it is
;                  reached from, and nobody goes in.
;   window_lights  A pane of glass in the middle of each lit window (not a glazing bar, which
;                  stays white when lit), in pixels from the sprite's top left, as an array of
;                  Vector2i. Empty for a building with no windows.
;   window_light   What each of them shines, like a world object's `light` (see
;                  WorldObjectTypes): color, energy and radius_tiles.
;   cost_logs,
;   cost_stone,
;   cost_clay,
;   cost_reeds     How many of each material placing it takes from the inventory (0 for none).
;
; Attributes for later, with no effect yet:
;   beds           How many beds it holds.
;   storage_slots  How many slots of storage it adds.
;   warmth         How well it keeps the cold out, from 0 (not at all) to 3.
;   comfort        How pleasant it is to rest in, from 0 to 3.

[shack]
name="Shack"
footprint=Vector2i(3, 2)
door_offset=Vector2i(1, 1)
sprite="res://assets/buildings/shack.png"
sprite_lit="res://assets/buildings/shack_lit.png"
interior_map="res://maps/interiors/shack.tmx"
window_lights=[Vector2i(37, 39)]
window_light={"color": Color(1, 0.62, 0.28, 1), "energy": 0.9, "radius_tiles": 2.5}
cost_logs=20
cost_stone=5
cost_clay=0
cost_reeds=0
beds=1
storage_slots=0
warmth=1
comfort=0

