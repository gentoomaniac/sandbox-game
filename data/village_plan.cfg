; The plan of the village Wehlsbüll (design/world/wehlsbuell.md, #9): where everything stands, as
; data. Hand-editable; read by game/world/village_plan.gd, which checks it (`problems`).
;
; Everything is in the village's own frame, in tiles: u runs east from the sea dyke's line in the
; row of the village's middle (the first row of land, see VillageSite), v runs south from that row.
; The coast wanders at most 8 tiles either side of it within the village's rows (the site is only
; taken where it does), so everything inland of u = 9 stands clear of the real dyke.
;
; A Rect2i is (u, v, width, height). A lane is a line through corner tiles, one tile wide. A gap
; is a tile of a ring left open. A door has to have its free tile in front, below it.

[village]
name="Wehlsbüll"
; The village's land, the rectangle of its record.
area=Rect2i(-18, -28, 79, 63)
; Inland of this u the ground is cleared and drained (and has to be dry land, see VillageSite).
inland_from_u=9
; Where the marsh ends and the Geest begins: a field is ringed by a ditch up to here and by a
; Knick beyond it (the marsh reaches data/landscape.cfg's [marsh] reach inland of the dyke).
marsh_end_u=36
; The town square, kept free but for the market stall and the notice board, and the middle where the
; villagers meet.
square=Rect2i(43, 6, 13, 6)
meeting_spot=Vector2i(49, 8)
; The free spot for the post mill, which does not exist as a building yet.
mill_spot=Rect2i(51, 15, 7, 7)
; The tile of each spot where a villager of data/villagers.cfg works (their `workplace_spot`): the
; root of the jetty, the middle of the free spot of the post mill, and behind the counter of the
; market stall.
workplace_spots={"the landing at the sluice": Vector2i(-12, 12), "the post mill": Vector2i(54, 18), "the market stall": Vector2i(45, 6)}
; The Sielzug, the ditch that drains the marsh through the dyke. Its first tile (u 0) is the real
; dyke's, row by row.
siel=Rect2i(0, 14, 29, 2)

; --- Warften: ovals of raised ground, as wide and as tall as the radii say ---

[warft.landing]
centre=Vector2(-7, 12)
radii=Vector2(5.5, 4)
; Out on the salt marsh, seaward of the dyke (the site needs salt marsh there).
is_on_salt_marsh=true

[warft.church]
centre=Vector2(31, 0)
radii=Vector2(12, 8)

[warft.boysen]
centre=Vector2(30, -17)
radii=Vector2(11, 6)

[warft.farm_2]
centre=Vector2(50, -15)
radii=Vector2(8, 6)

[warft.farm_3]
centre=Vector2(31, 23)
radii=Vector2(10, 6)

