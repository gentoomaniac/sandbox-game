; Weather: the baselines of every season and the thresholds of every condition. Hand-editable;
; read once when the game starts (see game/state/weather_rules.gd, weather.gd and sun.gd).

[sun]
; Day length follows a cosine over the 120-day year: the longest day is this many days into
; the year (the middle of summer), the shortest half a year later, and the day is 12 hours
; at the days in between (mid-spring and mid-autumn). Sunrise and sunset are centred on solar
; noon, which follows a cosine of its own over the year.
longest_day=45.0
; How many hours longer than 12 the longest day is (and shorter the shortest), at 100 %
; day length variation (see the Game settings).
day_length_swing_hours=6.25
; Solar noon in minutes since midnight at mid-summer and at mid-winter: the clock runs on
; summer time, so the sun is highest at 13:00 in summer and 12:15 in winter.
midsummer_noon=780.0
midwinter_noon=735.0
; How high the sun gets at noon on the shortest day, as a fraction of the highest (1).
lowest_noon_height=0.35

[daily]
; Humidity (percent) is this much lower in the afternoon than at the coldest hour.
humidity_swing=20.0
; Fog is likeliest from this many hours before sunrise to this many after it, and fades in
; and out over fade_hours.
fog_before_sunrise_hours=1.0
fog_after_sunrise_hours=4.0
fog_fade_hours=1.5
; Outside those hours the fog is only this fraction of what the weather allows.
fog_other_hours=0.25

[temperature]
; The temperature follows the sun through the day: it is coldest at sunrise, warms while the
; sun is up, is warmest this far through the daylight (0 is sunrise, 1 sunset) and cools
; through the night. At sunset it is this far up from the coldest towards the warmest ...
peak_at=0.6
sunset_level=0.4
; ... clouds take this fraction of the swing away at full cover (an overcast day warms less
; and an overcast night cools less) ...
cloud_damping=0.5
; ... and the swing is scaled by how long the sun is up (the warmth of the day) and how
; long it is down (the depth of the cold) in units of 12 hours, kept within these limits.
length_effect_min=0.5
length_effect_max=1.5

; Per season: the values in the middle of that season; the weather is a smooth curve through
; them over the year (so late autumn already leans towards winter), with random variation
; around it. Temperature mean and spread (degrees Celsius), the swing between the coldest
; and the warmest hour of a day, humidity mean and spread (percent), wind speed mean and
; spread (m/s), and cloudiness (added to the cloud cover that humidity brings: 0 is as the
; humidity says, 1 is a fully clouded sky). A spread is about the most a value strays from
; its mean (it rarely gets there); it is wide enough for the odd out-of-season spell.

[spring]
; Mild and showery.
temperature_mean=8.0
temperature_spread=8.0
temperature_swing=8.0
humidity_mean=62.0
humidity_spread=34.0
wind_mean=4.5
wind_spread=4.0
cloudiness=0.05

[summer]
; Warm and mostly dry, with the odd thunderstorm.
temperature_mean=18.0
temperature_spread=8.0
temperature_swing=10.0
humidity_mean=48.0
humidity_spread=40.0
wind_mean=3.0
wind_spread=4.0
cloudiness=-0.1

[autumn]
; Cooler, windy, foggy and rainy.
temperature_mean=8.0
temperature_spread=8.0
temperature_swing=6.0
humidity_mean=72.0
humidity_spread=30.0
wind_mean=6.0
wind_spread=5.0
cloudiness=0.1

[winter]
; Cold, with snow.
temperature_mean=-5.0
temperature_spread=8.0
temperature_swing=4.0
humidity_mean=66.0
humidity_spread=32.0
wind_mean=4.5
wind_spread=4.0
cloudiness=0.15

[clouds]
; The sky clouds over as humidity rises from "from" (clear) to "full" (overcast).
humidity_from=45.0
humidity_full=95.0
; Sunlight under a fully clouded sky, as a percentage of what the sun gives under a clear one.
overcast_sunlight=20.0

[precipitation]
; Rain or snow falls as humidity rises from "from" (nothing) to "full" (heaviest).
humidity_from=70.0
humidity_full=95.0
; Degrees Celsius over which snow turns to rain: all snow at 0 or below, all rain at this
; temperature or above, sleet in between. So it never rains below freezing.
rain_from_temperature=2.0

[fog]
; Fog needs humidity from "from" (none) to "full" (thickest) ...
humidity_from=64.0
humidity_full=84.0
; ... and little wind: it is gone at this wind speed (m/s).
calm_wind=7.0

[wind]
; Strong wind starts at this speed (m/s) and is at its fiercest at the second.
strong_from=8.0
strong_full=16.0

[thunder]
; A thunderstorm needs all three: warm, humid and windy, each from "from" (none) to "full".
temperature_from=16.0
temperature_full=24.0
humidity_from=64.0
humidity_full=84.0
wind_from=2.0
wind_full=6.0
; The chance of a lightning flash in a game minute of a full thunderstorm.
lightning_per_minute=0.1
