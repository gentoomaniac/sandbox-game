; Vegetation density over the year: every tunable number of the seasonal plants. Hand-editable;
; read once when the game starts (see game/state/vegetation.gd).
;
; A curve is a list of Vector2(day, density) anchors, sorted by day. The day is the day of
; the year, 1 to 120 (spring 1-30, summer 31-60, autumn 61-90, winter 91-120). The density
; runs from 0 (nothing) to 1 (everything) and is interpolated smoothly between the anchors,
; wrapping around the new year (the last anchor leads into the first one). Each spot or plant
; has a fixed random threshold in [0, 1) and shows while the density is above it: at density
; 0.3, three in ten spots show, and as the density rises the others join one by one.

[decorations]
; Ground cover: what shows on a spot depends on its kind (see TerrainTileset.DECORATION_KINDS).
; Grass tufts: sparse in early spring, full in summer, thinner in autumn, a few dry stalks
; poking through the snow in winter.
tuft=[Vector2(15, 0.55), Vector2(45, 1.0), Vector2(75, 0.55), Vector2(105, 0.03)]
; Flowers bloom in spring and summer and are gone by the middle of autumn.
flower=[Vector2(8, 0.0), Vector2(25, 0.7), Vector2(48, 0.9), Vector2(72, 0.1), Vector2(84, 0.0)]
; Clover, ferns and mushrooms on the ground: they follow the tufts, but die back for winter.
small_plant=[Vector2(10, 0.15), Vector2(45, 1.0), Vector2(75, 0.5), Vector2(95, 0.0)]
; Fallen leaves cover the ground in autumn and are mostly under the snow in winter.
leaves=[Vector2(55, 0.0), Vector2(75, 0.7), Vector2(88, 1.0), Vector2(105, 0.15), Vector2(118, 0.0)]

[objects]
; Seasonal world objects: density 1 means every plant of that kind is there.
; Fern bush: dormant (gone from the world, not harvestable) from late autumn to mid spring,
; coming back one by one from early spring on.
fern_bush=[Vector2(5, 0.0), Vector2(25, 0.6), Vector2(40, 1.0), Vector2(65, 1.0), Vector2(85, 0.35), Vector2(100, 0.0)]
; Tall grass: comes in over spring, stands full through summer and autumn's start, thins out
; in autumn and is gone (not there to mow) from late autumn to early spring.
tall_grass=[Vector2(8, 0.0), Vector2(30, 0.8), Vector2(42, 1.0), Vector2(60, 1.0), Vector2(80, 0.3), Vector2(92, 0.0)]
; Berry bush: carries berries from early summer to late autumn. A bush with a low threshold
; fruits early and long, one with a high threshold late and short.
berry_bush=[Vector2(30, 0.0), Vector2(45, 1.0), Vector2(70, 1.0), Vector2(92, 0.0)]

[flowers]
; The meadow flowers (see data/flowers.cfg for where they grow): how much of each species is in
; bloom. A spot of a species blooms while the density is above its threshold, so a species
; opens a few flowers first, then more, and fades the same way. Early spring has the few small
; spring flowers, late spring and summer are full, autumn has the last yarrow and heather, and
; winter has none.
; Wood anemone: the beech woods before the leaves close over them.
wood_anemone=[Vector2(1, 0.0), Vector2(10, 0.6), Vector2(16, 1.0), Vector2(24, 0.4), Vector2(31, 0.0)]
; Dandelion: the first yellow of the pastures, over by early summer.
dandelion=[Vector2(3, 0.0), Vector2(10, 0.4), Vector2(18, 1.0), Vector2(25, 0.9), Vector2(33, 0.1), Vector2(39, 0.0)]
; Cuckooflower (lady's smock): wet meadows in spring.
cuckooflower=[Vector2(4, 0.0), Vector2(14, 0.8), Vector2(20, 1.0), Vector2(30, 0.2), Vector2(37, 0.0)]
; Daisy: from early spring to late summer, thinning out in autumn.
daisy=[Vector2(4, 0.0), Vector2(12, 0.4), Vector2(22, 0.9), Vector2(50, 0.8), Vector2(66, 0.3), Vector2(76, 0.0)]
; Buttercup: late spring and early summer.
buttercup=[Vector2(14, 0.0), Vector2(24, 0.8), Vector2(34, 1.0), Vector2(48, 0.8), Vector2(58, 0.1), Vector2(63, 0.0)]
; Red campion: wood edges, late spring into summer.
red_campion=[Vector2(15, 0.0), Vector2(26, 0.9), Vector2(44, 0.9), Vector2(56, 0.0)]
; Red and white clover: the pastures of summer.
red_clover=[Vector2(26, 0.0), Vector2(38, 0.8), Vector2(46, 1.0), Vector2(60, 0.5), Vector2(70, 0.0)]
white_clover=[Vector2(24, 0.0), Vector2(36, 0.8), Vector2(48, 1.0), Vector2(62, 0.4), Vector2(70, 0.0)]
; Yarrow: midsummer into autumn.
yarrow=[Vector2(36, 0.0), Vector2(48, 0.8), Vector2(58, 1.0), Vector2(70, 0.4), Vector2(80, 0.0)]
; Knapweed: high and late summer.
knapweed=[Vector2(38, 0.0), Vector2(48, 0.7), Vector2(56, 1.0), Vector2(66, 0.5), Vector2(74, 0.0)]
; Meadowsweet: by the water in summer.
meadowsweet=[Vector2(34, 0.0), Vector2(46, 0.8), Vector2(54, 1.0), Vector2(62, 0.3), Vector2(69, 0.0)]
; Heather: the Geest turns purple in late summer and early autumn.
heather=[Vector2(48, 0.0), Vector2(56, 0.6), Vector2(64, 1.0), Vector2(72, 0.6), Vector2(82, 0.0)]
