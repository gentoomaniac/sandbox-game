; What a villager trades for small things with a player they know as a neighbour (see
; game/state/barter_rules.gd and design/economy/README.md, "Barter with villagers"). Read once when
; the game starts. Who may barter is the benefit `barter` of data/friendship.cfg, never a number
; here. The rates never depend on friendship: both sides are valued at the plain worth, so no loop
; of deals can make goods out of nothing.
;
; [deal]: cap, the most a deal may be worth to either side, in whole Schilling. Nobody barters a
; cow.
;
; [<villager id>] (a villager of data/villagers.cfg, one with no section does not barter):
; - offers: the goods they give (items of the game with a worth in data/prices.cfg).
; - wants: the goods they take, the same kind of list. No good is both, so a deal never turns
;   back into itself. A villager has no stock and no purse: barter is goods for goods, and where
;   the worths differ the player adds goods.
; Both sides are valued at the worth of data/prices.cfg, with no shop's percentages.

[deal]
cap=100

[antje]
offers=["egg", "berries"]
wants=["flour", "fibre", "reeds"]

[hinrich]
offers=["turnip", "hay"]
wants=["logs", "clay", "fibre"]

[momme]
offers=["reeds", "fibre"]
wants=["bread", "flour"]

[ocke]
offers=["flour"]
wants=["egg", "logs"]

[gesche]
offers=["bread"]
wants=["berries", "egg"]

[kerrin]
offers=["berries", "hay"]
wants=["candle", "bread"]

[inken]
offers=["berries"]
wants=["fibre", "bread"]

[boy]
offers=["hay"]
wants=["egg", "bread"]
