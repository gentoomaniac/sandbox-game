; Light: how dark the night gets outdoors, and when dusk and dawn come. Hand-editable; read once
; when the game starts (see game/state/lighting_rules.gd and game/scenes/day_night_tint.gd).
;
; The world outdoors is tinted by the time of day: every colour of the picture is multiplied by
; the tint, so (1, 1, 1) leaves it as drawn and the lower a channel the darker that colour gets.
; The lights (campfires, lit windows, the hearth, fireflies) are added on top of the tint, so they
; shine as brightly in the darkest night. Inside a house the tint is fixed (warm, as from lamps).

[day_and_night]
; The tint at the stops of the day; between two stops it blends evenly from one to the next.
; Full night: bluish and readable, not black.
night=Color(0.4, 0.46, 0.74, 1)
; At sunrise.
dawn=Color(1, 0.82, 0.7, 1)
; Full day.
day=Color(1, 1, 1, 1)
; Just after sunset, an orange glow (a channel above 1 brightens it a little) ...
dusk_glow=Color(1.05, 0.66, 0.46, 1)
; ... and later a purple twilight.
dusk_purple=Color(0.7, 0.52, 0.7, 1)
; Where the stops are, in hours relative to sunrise and sunset (see data/weather.cfg [sun]):
; night until this many hours before sunrise, then the dawn at sunrise ...
night_before_sunrise=1.5
; ... and full day this many hours after it.
day_after_sunrise=2.0
; Full day until this many hours before sunset, the glow this many hours after it, the purple
; later ...
day_before_sunset=1.0
glow_after_sunset=0.5
purple_after_sunset=2.5
; ... and night this many hours after sunset.
night_after_sunset=4.0
; A night is at least this many hours of full night: in the short nights of summer the dusk and
; the dawn are squeezed to leave it.
min_night_hours=1.0
