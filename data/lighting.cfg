; Light: how dark the night gets outdoors, and when dusk and dawn come. Hand-editable; read once
; when the game starts (see game/state/lighting_rules.gd and game/scenes/day_night_tint.gd).
;
; The world outdoors is tinted by the time of day: every colour of the picture is multiplied by
; the tint, so (1, 1, 1) leaves it as drawn and the lower a channel the darker that colour gets.
; The lights (campfires, lit windows, the hearth, fireflies) are added on top of the tint, so they
; shine as brightly in the darkest night. Inside a house the tint is fixed (warm, as from lamps).

[day_and_night]
; The tint at the stops of the day; between two stops it blends evenly from one to the next.
; Full night: dark blue, little more than shapes away from a light, but not black (task 177; it
; was Color(0.4, 0.46, 0.74, 1), bluish and readable). A lit lantern or a fire is the way to see.
night=Color(0.13, 0.16, 0.3, 1)
; At sunrise.
dawn=Color(1, 0.82, 0.7, 1)
; Full day.
day=Color(1, 1, 1, 1)
; Just after sunset, an orange glow (a channel above 1 brightens it a little) ...
dusk_glow=Color(1.05, 0.66, 0.46, 1)
; ... and later a purple twilight.
dusk_purple=Color(0.7, 0.52, 0.7, 1)
; Where the stops are, in hours relative to sunrise and sunset (see data/weather.cfg [sun]):
; night until this many hours before sunrise, then the dawn at sunrise ...
night_before_sunrise=1.5
; ... and full day this many hours after it.
day_after_sunrise=2.0
; Full day until this many hours before sunset, the glow this many hours after it, the purple
; later ...
day_before_sunset=1.0
glow_after_sunset=0.5
purple_after_sunset=2.5
; ... and night this many hours after sunset.
night_after_sunset=4.0
; A night is at least this many hours of full night: in the short nights of summer the dusk and
; the dawn are squeezed to leave it.
min_night_hours=1.0

[lantern]
; The light of a lit lantern the player carries (see game/scenes/player_view.gd), like a world
; object's `light`: its colour, how bright it is in the middle and how far it reaches, in tiles
; (the campfire reaches 7, a lit window 2.5). It flickers a little, as the fires do, and shines
; only in the dark, as strongly as the other lights at that hour.
color=Color(1, 0.66, 0.36, 1)
energy=1.3
radius_tiles=5.0

[cloud_shadows]
; Shadows of clouds drifting over the ground by day (a look only: nothing in the state follows
; them; see game/scenes/weather_view.gd and cloud_shadows.gdshader). They show with the sun out
; and some cloud, are more and larger with more cover, drift downwind and fade out with dusk.
; How dark the darkest part of a shadow is: 0 is none, 1 is black.
strength=0.28
; How wide a patch of shadow is, in pixels (a tile is 32). It stays the same with the cover, so a
; change of cover does not slide the pattern; more cover shows as more ground in shadow.
size=170.0
; How much of the ground is in shadow at full cover, and how wide the soft edge is (0 to 1).
coverage=0.85
softness=0.25
; Pixels per second for every m/s of wind: they drift downwind at this speed.
speed_per_wind=7.0
; From this cover on the shadows fade out, until none are left under a closed sky: that is only
; a little darker, as the day tint dims the overcast day (see game/scenes/day_night_tint.gd).
closed_from=0.75
