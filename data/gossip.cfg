; What the player does near villagers, and who sees it (see game/state/gossip_rules.gd,
; game/state/deed_log.gd, design/villagers/gossip.md and README "The deed log"). Hand-editable;
; read once when the game starts. Words in braces, such as {count}, are filled in by the game.

[witnesses]
; Every villager within this many tiles of a deed sees it: by day, and at night, when they stand
; still and see less. A deed with no one in reach is not written down.
radius_tiles=20.0
night_radius_tiles=6.0
; The place of a deed is the house (the anchor) of the villager nearest to it within the daytime
; radius, else the word of the ground it happened on.

[log]
; A deed is kept in the log for this many days, today's included. The stories of the villagers
; stay in their gossip buffer until newer ones push them out.
keep_days=7

[opinion]
; What a villager thinks of the player, in points (the friendship points of
; design/villagers/relationships.md), from `min_points` to `max_points`; a villager starts at 0.
; It moves by `daily_cap_points` at most in a day, up and down alike. The chat prompt tells it in
; words: cold below `cold_below`, warm from `warm_from`, else neutral.
min_points=-100
max_points=1000
daily_cap_points=20
cold_below=-20
warm_from=20

[meetings]
; How stories pass between villagers (see game/state/gossip_spread.gd, design/villagers/gossip.md).
; Two villagers closer than `radius_tiles` meet, and the same two meet again only after
; `pair_wait_minutes` of game time. At a meeting each may pass on one story the other lacks:
; the weightiest and newest that they have known for `story_wait_minutes`, whose deed is fewer
; than `max_story_days` days old and which has come fewer than `max_hops` hops from the villager
; who saw it. Whether they do depends on the tie: `chance_family` for family and friends on the
; sheet, `chance_neighbour` for the `neighbours` villagers whose anchors are nearest to the
; teller's, `chance_anyone` for the rest.
radius_tiles=3.0
pair_wait_minutes=60
story_wait_minutes=120
max_hops=3
max_story_days=7
neighbours=3
chance_family=0.8
chance_neighbour=0.5
chance_anyone=0.2

[whispers]
; At each hop a story may change, with this chance: one of the count (it grows to the next of the
; steps), the place (it moves to the house of one of the teller's neighbours) or the kind of
; deed (it turns into a similar one, see [whisper_kinds]) shifts.
chance=0.1
count_steps=[2, 3, 5, 7, 10, 12, 20, 30, 50, 100]

[whisper_kinds]
; What each kind of deed turns into when the story shifts it: a kind of deed, another one.
felled="mowed"
built="fenced"
took_down="felled"
fenced="built"
tilled="sowed"
sowed="tilled"
harvested="mowed"
dug_clay="tilled"
mowed="harvested"

[counts]
; Counts that are told in words ({count} of a deed, see [felled] and the like).
words={12: "a dozen", 20: "a score", 100: "a hundred"}

[places]
; "by Antje's house": {name} is the first name of the villager whose house is nearest.
house="by {name}'s house"
; The words for the ground (a terrain of the game), when no house is in reach.
grass="out on the geest"
soil="out in the fields"
water="by the water"
wetland="in the wet meadows"
floodplain="on the river meadows"
floor="indoors"
wall="indoors"
clay_floor="indoors"
mud="out on the mudflats"
salt_marsh="out on the salt marsh"
sea="by the sea"
warft="on the warft"

[story]
; How a villager is told a deed they saw (one they only heard of has the `heard_` lines below):
; {deed} is the deed's words (after "the newcomer"), {place} the place. `earlier` is for deeds of two or more days ago; {days} is how many.
today="Today you saw the newcomer {deed} {place}."
yesterday="Yesterday you saw the newcomer {deed} {place}."
earlier="{days} days ago you saw the newcomer {deed} {place}."
; The line a story leaves in long-term memory when it drops out of the gossip buffer: {day} is the
; day of the deed.
memory="On day {day}: you saw the newcomer {deed} {place}."
; The same for a story a villager heard from another: {teller} is the first name of who told them.
heard_today="Today {teller} told you that the newcomer was seen to {deed} {place}."
heard_yesterday="Yesterday {teller} told you that the newcomer was seen to {deed} {place}."
heard_earlier="{days} days ago {teller} told you that the newcomer was seen to {deed} {place}."
heard_memory="On day {day}: {teller} told you that the newcomer was seen to {deed} {place}."

; One section per deed kind: `one` says a single deed, `many` several ({count}), `change` is
; how much the villagers who saw it think more (or less) of the player, from -2 to 2 (used by
; the opinions of a later task).

[felled]
one="fell a tree"
many="fell {count} trees"
change=-1

[built]
one="build a house"
many="build {count} houses"
change=1

[took_down]
one="take down a building"
many="take down {count} buildings"
change=-2

[fenced]
one="put up a fence or wall"
many="put up {count} lengths of fence or wall"
change=0

[tilled]
one="till a patch of ground"
many="till {count} patches of ground"
change=0

[sowed]
one="sow a bed"
many="sow {count} beds"
change=0

[harvested]
one="bring in a crop"
many="bring in {count} crops"
change=0

[dug_clay]
one="dig clay"
many="dig clay {count} times"
change=0

[mowed]
one="mow a patch of grass"
many="mow {count} patches of grass"
change=0
