; How villagers talk through a language model (see game/state/npc_prompt.gd, and README "Talking
; NPCs"): the request, the prompt and the words it is made of, and what they say without one. Read once when the game starts
; (see game/state/npc_talk_rules.gd). Words in braces, such as {name}, are filled in by the game.
;
; The prompt is a chat: the system line with the village's sheet (data/village.cfg) and the
; villager's (data/villagers.cfg, or drawn from the tables of data/npcs.cfg), the example
; exchange, the earlier lines of this chat (each line of the player in the shape of the example,
; each of the villager as their answer), and last what the player just said, with their look and
; the moment told between the villager line and what the neighbour says.
;
; A hosted model (a provider that needs a key, such as Gemini or Claude: GameSettings
; LANGUAGE_MODEL_PROVIDERS `needs_key`) is told the full sheets; a local model the cut-down ones
; (`sheet_short`, `person_short` and the `short` of the village), which keep a 3B or 7B fast.

[request]
; Sent with every request, as the OpenAI chat API takes them. `max_tokens` here, in [memory] and
; in [claude] are the game's own; "Max tokens per answer" in Settings replaces them for a provider,
; and "Temperature" in Settings replaces `temperature` for the villager's reply (not the memory's).
; 0.5 since task 96: with the sheets it slipped a little less often than 0.7 (TASKS.md 96).
temperature=0.5
max_tokens=60
; A reply keeps this many sentences at the most.
reply_sentences=2
; A model that has not answered after this many real seconds is given up on: the villager says a
; scripted line instead.
timeout_seconds=30.0
; The list of models in Settings (see game/scenes/language_model_page.gd): the endpoint is asked
; for it this many seconds after the last key typed in the endpoint or the key field, and given
; up on after `models_timeout_seconds`.
models_delay_seconds=0.6
models_timeout_seconds=5.0

; What Claude's API (see game/scenes/claude_chat.gd) is sent besides the prompt. It takes no
; temperature, and a model's thinking counts against `max_tokens`, so it gets more than the 60 or
; 40 of [request] and [memory] (a reply is trimmed to its sentences anyway); `effort` is low as
; small talk needs little thought. `fallback_models` are those that take server-side fallbacks on
; a refusal (`fallback_beta` is the header that asks for them); others, such as Haiku, would
; answer with an error.
[claude]
api_version="2026-10-21"
max_tokens=1000
effort="low"
fallback_models=["claude-opus-5-5", "claude-sonnet-5-5", "claude-fable-5-1"]
fallback_beta="server-side-fallback-2026-07-01"

[prompt]
system="You write dialogue lines for one villager of Wehlsbüll, a village on the North Frisian coast, in a game set in 1750. Answer with the villager's spoken line only: one or two short sentences of plain, casual small talk that answer what the neighbour just said. Answer in the language of the neighbour's latest line (English, German or Danish), even when earlier lines were in another; if the neighbour wrote English, answer in English, whatever the villager's home. Never break character, never mention being an AI, never offer help or advice like an assistant. Keep to the sheets below and to what was said earlier; never contradict them. Never make up relatives, friends, names or places that are not on the sheets: asked about one, the villager says they don't know or turns the talk elsewhere. Speak in the villager's own manner; the sample lines show the manner, not the language. Use the sheets only where they fit, never recite them. Nobody knows things that did not exist in 1750, such as phones or cars: the villager is puzzled and says so. If the neighbour is rude, the villager answers sharply or turns away."
; The sheets of the system line: {village} is the village's, the rest the villager's (see
; data/villagers.cfg for what each part is). {people} is the line of their family and friends:
; `people` with each of them as `person` (or `person_short`), `no_people` for a made-up villager,
; or left out for one written by hand whose people are all gone from data/villagers.cfg (the
; background may still name them).
village="The village sheet, which everyone there knows:\n{village}"
sheet="The villager's sheet:\n{name}, {trade}, {age} years old. {personality} {background}\nHome: {home}\n{people}\nHow {first_name} talks: {speech}\nSample lines, for the manner only: {samples}\nLikes and dislikes: {likes}\nThis year {first_name} wants: {wants}\n{first_name}'s day: {day}\nHabits: {habits}\nWhat {first_name} doesn't know or won't talk about: {avoids}\nSecrets, at most hinted at: {secrets}"
sheet_short="The villager's sheet:\n{name}, {trade}, {age} years old. {personality} {background}\n{people}\nHow {first_name} talks: {speech}\nSample lines, for the manner only: {samples}"
person="{name}, {kind}, {age}: {thought}"
person_short="{name} ({kind})"
people="Family and friends: {people}"
no_people="Family and friends: none in the village; {first_name} knows its families only by sight and name."
; The example exchange: what the player says, and the villager's answer. The villager is not one of the game's, so that the model does not take the answer or its habits (Hinrich, "Aye") for the real villager's.
example="Villager: Hark Nissen, a blacksmith.\nHis neighbour says: \"Fine weather for the hay today.\"\nHark's reply:"
example_reply="Fine for the hay, aye, but the forge makes it hot enough for me."
; Each line of the player is told as `villager`, `says` and `reply`, each on a line of its own;
; the last one also has `about`, `memory` (if they remember earlier conversations, joined by
; spaces), `moment` and `neighbour` after the villager line, `language` after `says`, and
; `last_reply` for `reply`: both name the language right before the answer ({language}, as the
; game detects it, see [language] below), so the model follows the language the player switched
; to rather than that of the earlier lines or of the English prompt. Where the language is not
; known the `_unknown` lines take their place (`last_reply_unknown` is told the {message}).
villager="Villager: {name}, {trade}."
about="{first_name} is {age} years old, {looks}."
memory="{first_name} remembers earlier talks with this neighbour: {memories}"
moment="It is {date}, {time} {part_of_day}. The weather: {weather}. {first_name} is {place}."
; Without it the model makes up a name for the player and keeps calling them by it.
neighbour="The neighbour is a newcomer to these parts; {first_name} does not know their name."
says="{their} neighbour says: \"{message}\""
language="{first_name} answers in {language}."
language_unknown="{first_name} answers in the language the neighbour just spoke in."
reply="{first_name}'s reply:"
last_reply="{first_name}'s reply in {language}:"
last_reply_unknown="{first_name}'s reply (in the language of \"{message}\"):"

; The language the player speaks, told to the model as {language} of `language` and `last_reply`
; (see game/state/npc_language.gd): a line scores one for a language per word of its list and
; `letter_score` per letter of `letters` (only that language has them), and the language is told
; if it scores `min_score` or more and more than any other. A line that can't be told (a name, a
; greeting such as "Moin" or "Hej") has the language of the player's latest line before it that
; can; with none, the `_unknown` lines above are used. The word lists are short common words that
; mostly one of the languages has: a word of two languages (such as "die" or "in") is left out.
; The list of `other` is for languages the game does not know (here Swedish) and is not in
; `names`: a line that scores most there is told as no language, and an earlier line's does not
; stand in for it, so the model is only asked for the language the neighbour spoke in. It keeps
; Swedish from being taken for Danish (as does "å" not being a telling letter: Swedish and
; Norwegian have it too). Swedish has ä and ö as German does, so they score for `other` too: a
; Swedish line with an ö is not taken for German (a German one has German words besides).
; Danish words that Swedish has too (det, går, dig, mig, har, med, men, som, kan) are in both
; lists, so they favour neither and the words that only one has decide;
; "er" is Danish here but also German ("he"), which only matters in a line with no other word.
[language]
names={"en": "English", "de": "German", "da": "Danish"}
words={"en": ["the", "and", "is", "are", "you", "your", "i", "my", "me", "to", "of", "it", "that", "this", "what", "how", "do", "does", "did", "have", "has", "with", "not", "can", "will", "would", "could", "hello", "good", "morning", "evening", "day", "where", "who", "why", "when", "which", "thank", "thanks", "please", "about", "tell", "there", "here", "from", "don", "ll", "any", "some"], "de": ["ich", "der", "das", "und", "ist", "nicht", "ein", "eine", "wie", "wo", "wer", "warum", "wann", "guten", "tag", "abend", "danke", "bitte", "nein", "mein", "meine", "meinen", "dein", "deine", "deinen", "hast", "habe", "haben", "auch", "aber", "noch", "schon", "für", "von", "zu", "auf", "es", "wir", "ihr", "geht", "gut", "heute", "kannst", "können", "dir", "dich", "mir", "mich", "sie", "euch", "wird", "sind", "ihm"], "da": ["jeg", "det", "er", "og", "ikke", "en", "et", "med", "hvad", "hvordan", "hvor", "hvem", "hvorfor", "hvornår", "goddag", "godmorgen", "godaften", "tak", "nej", "min", "mig", "dig", "har", "til", "af", "på", "som", "men", "også", "kan", "godt", "går", "fra", "vil", "skal", "os", "jer", "han", "hun", "var", "ved"], "other": ["jag", "inte", "vem", "då", "och", "är", "vad", "hur", "idag", "tjena", "tack", "att", "ett", "för", "bra", "mycket", "oss", "vi", "också", "här", "ju", "nu", "vill", "kommer", "från", "mår", "det", "går", "dig", "mig", "har", "med", "men", "som", "kan"]}
letters={"de": "äöüß", "da": "æø", "other": "äö"}
letter_score=2
min_score=2

; The words that differ by the villager's sex.
[female]
their="Her"
person="woman"

[male]
their="His"
person="man"

; A villager's look in words, from the layers they wear (see data/npcs.cfg): `sentence` with the
; skin, the hair and what they wear, the worn things in the order of `worn`.
[looks]
sentence="a {skin} {person} with {hair}, wearing {worn}"
body={"0": "fair-skinned", "fair": "pale", "tanned": "sun-tanned", "dark": "dark-skinned"}
hair_styles={"short": "short {colour} hair", "long": "long {colour} hair", "tied": "{colour} hair tied back", "bun": "{colour} hair in a bun", "plaits": "{colour} hair in plaits"}
hair_colours={"brown": "brown", "blond": "blond", "red": "red", "grey": "grey", "black": "black"}
worn=["head", "coat", "clothes", "apron", "legs", "feet"]
head={"knitted_cap": "a red knitted cap", "knitted_cap_white": "a white knitted cap", "tricorne": "a tricorne", "straw_hat": "a straw hat", "felt_hat": "a felt hat", "coif": "a white coif", "scarf_red": "a red headscarf", "scarf_blue": "a blue headscarf"}
coat={"jacket": "a blue jacket", "jacket_brown": "a brown jacket", "jacket_black": "a black jacket", "shawl_red": "a red shawl", "shawl_cream": "a cream shawl", "shawl_heather": "a heather shawl"}
clothes={"0": "a red waistcoat", "1": "a linen shirt", "waistcoat_blue": "a blue waistcoat", "waistcoat_green": "a green waistcoat", "waistcoat_brown": "a brown waistcoat", "waistcoat_black": "a black waistcoat", "bodice_red": "a red bodice", "bodice_blue": "a blue bodice", "bodice_green": "a green bodice", "bodice_black": "a black bodice"}
apron={"white": "a white apron", "blue": "a blue apron", "striped": "a striped apron"}
legs={"0": "brown breeches", "breeches_leather": "leather breeches", "breeches_black": "black breeches", "breeches_blue": "blue breeches", "skirt_red": "a red skirt", "skirt_blue": "a blue skirt", "skirt_brown": "a brown skirt", "skirt_black": "a black skirt", "skirt_heather": "a heather skirt"}
feet={"clogs": "clogs"}

; The moment: the date as the clock shows it with how far into the season it is (the season
; split evenly into `season_parts`), and the part of the day by the sun.
[moment]
date="the {day} day of {season}, year {year} ({season_part} {season_lower})"
season_parts=["early", "mid", "late"]
; Dawn and dusk are this many minutes either side of sunrise and sunset, noon either side of the
; sun's highest; morning, afternoon and night lie between them.
dawn_minutes=45
noon_minutes=60
dusk_minutes=45
parts_of_day={"dawn": "at dawn", "morning": "in the morning", "noon": "at noon", "afternoon": "in the afternoon", "dusk": "at dusk", "night": "at night"}

; The weather in words: what falls or hangs in the air, the temperature and the wind, joined by
; commas ("light rain, 9 °C, a fresh west wind"). Each list is [from, words] pairs, weakest first:
; the words of the highest `from` reached apply. Conditions run 0 to 1 (see WeatherSample); the
; first one in `conditions` that is there is told, else the sky by its cloud cover (0 to 1).
[weather]
conditions=["thunder", "storm", "snow", "rain", "fog"]
thunder=[[0.05, "a thunderstorm"]]
storm=[[0.05, "a storm"]]
snow=[[0.05, "light snow"], [0.4, "snow"], [0.75, "heavy snow"]]
rain=[[0.05, "light rain"], [0.4, "rain"], [0.75, "heavy rain"]]
fog=[[0.05, "mist"], [0.5, "thick fog"]]
sky=[[0.0, "a clear sky"], [0.3, "some clouds"], [0.7, "overcast"]]
temperature="{degrees} °C"
; Told after the temperature below 0 °C.
frost="frost"
; By wind speed in metres per second; {from} is where it blows from, one of `directions`
; (east first, then round by the south).
wind=[[0.0, "still air"], [1.5, "a light {from} breeze"], [5.5, "a fresh {from} wind"], [10.8, "a strong {from} wind"], [17.2, "a {from} gale"]]
directions=["east", "south-east", "south", "south-west", "west", "north-west", "north", "north-east"]

; Where the villager stands: by the nearest building within `reach` tiles, else by a fireplace
; within it, else out in the open.
[place]
reach=8.0
building="outside the {building}"
fireplace="by the campfire"
open="out in the open"

; What villagers say without a language model (none set in Settings), or when it fails or takes
; too long: one of `replies`, each as likely, after `thinking_seconds` (real seconds) without one.
[scripted]
thinking_seconds=0.5
replies=["Aye.", "Is that so?", "Well, well.", "Hm. Could be.", "Ach, you don't say.", "Aye, that's how it goes."]

; When lines drop out of the chat (which keeps the length set in Settings), the villager
; remembers them in one line (see Npc), told in later prompts (`memory` of [prompt]): with a
; model it is asked to sum the lines up, in a request of its own, else the line is `plain` with
; the start of what the player said. Either way it is `dated` with the day.
[memory]
system="You keep the memory of a villager in a game set on the North Frisian coast in 1750. Sum up the conversation in one short sentence of at most 25 words, written by the villager in the first person (\"I\"): what the neighbour said or wanted, and what I answered. Plain words, no quotes."
conversation="Villager: {name}, {trade}.\nThe conversation:\n{lines}\nWhat {first_name} remembers of it, in one sentence that starts with \"I\":"
neighbour_line="Neighbour: {text}"
villager_line="{first_name}: {text}"
; Low, so a memory is a plain sum of the lines; the "Temperature" of Settings is not used for it.
temperature=0.3
max_tokens=40
plain="The neighbour said: \"{said}\""
; How much of what the player said `plain` keeps, in characters.
plain_length=120
dated="On {date}: {summary}"
