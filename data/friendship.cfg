; How well a villager knows the player: the ten levels of friendship (see
; game/state/friendship_rules.gd and design/villagers/relationships.md). Hand-editable; read once
; when the game starts. A level is a range of a villager's opinion of the player, in points (see
; [opinion] of data/gossip.cfg), so the points of a save never change when a level moves.

[levels]
; level_<n>=[name, first point, mood]: a level reaches from its first point to the point before
; the next level's. The first level starts at the lowest opinion (`min_points` of [opinion] of
; data/gossip.cfg). The mood is `cold`, `neutral` or `warm`: it picks the bubbles a villager
; says near the player (see game/state/npc_bubbles.gd).
level_1=["Shunned", -100, "cold"]
level_2=["Mistrusted", -60, "cold"]
level_3=["Stranger", -20, "neutral"]
level_4=["Acquaintance", 20, "warm"]
level_5=["Neighbour", 100, "warm"]
level_6=["Good neighbour", 220, "warm"]
level_7=["Friend", 380, "warm"]
level_8=["Trusted friend", 560, "warm"]
level_9=["Close friend", 740, "warm"]
level_10=["Heart's friend", 900, "warm"]

[caps]
; What the player's actions (gifts, a first chat, deeds; not what stories move, see [opinion] of
; data/gossip.cfg) move a villager's opinion in a day, in points, up and down alike. It keeps a
; gift and a deed from carrying a villager from stranger to friend in an hour.
action_daily_cap_points=60

[gifts]
; What a gift moves a villager's opinion by, in points, by whether the villager likes the item,
; has no feelings about it or dislikes it (`gifts_liked` and `gifts_disliked` of
; data/villagers.cfg, [gifts] of data/npcs.cfg). A villager takes one gift a day.
liked_points=40
neutral_points=10
disliked_points=-20

[talk]
; What the first chat of a day with a villager moves their opinion by, in points (needs no
; language model; see game/state/talk_friendship.gd). A later chat of the day moves nothing.
first_chat_points=5

[rating]
; What the model's rating of the player's words (see [word_rating] of data/npc_talk.cfg) moves a
; villager's opinion by, in points: `warm_points` for a kind or interested line, `rude_points` for
; a rude one. Over a day the ratings move it by `warm_daily_cap_points` up and `rude_daily_cap_points`
; down at most, and a villager is asked for `requests_per_day` ratings at most, so the cost is
; bounded. The points count within the cap of the actions, like the rest.
warm_points=5
rude_points=-10
warm_daily_cap_points=5
rude_daily_cap_points=10
requests_per_day=3

[harm]
; What the villagers who see harm done to a villager's things, or to a villager, lose of their
; friendship, in points (see game/state/harm.gd): stealing (taking from a chest, a field or a nest),
; damage (cutting a Knick, breaking a fence or wall) and rudeness (walking through a villager).
; Unseen harm costs nothing. They count within the cap of the actions.
stole_points=-50
damaged_points=-20
rude_points=-20
; A thing on the village's land is the villager's whose house is nearest, if one is within this many
; tiles.
owner_reach_tiles=12.0
; A villager the player's feet come within this many tiles of is pushed through.
push_tiles=0.4

[benefits]
; What a level opens (see design/villagers/relationships.md): each benefit with the lowest level
; that has it. Code asks FriendshipRules `allows`, never a number. A sheet may open a benefit
; earlier (or hold it back) for one villager, with `benefit_level` in data/villagers.cfg.
; talk: chats at all (at level 1 the villager turns away). trade: their shop or service is open to
; the player. quests: they post quests. greets_by_name, small_news: the greeting uses the player's
; name; news and the lore of their trade. barter, tells_wants: barters at the market price; says
; what they want this year. better_prices, lends_tool: better prices in their shop; lends a tool.
; teaches: teaches a craft or recipe of their trade. tells_secrets, invites_inside: the sheet's
; `secrets` are open to the model; the door is open. best_wares: the best goods of the shop or the
; pedlar. may_court: courting may start, if the sheet allows it.
talk=2
trade=3
quests=3
greets_by_name=4
small_news=4
barter=5
tells_wants=5
better_prices=6
lends_tool=6
teaches=7
tells_secrets=8
invites_inside=8
best_wares=9
may_court=10

[shop]
; What a shopkeeper whose `better_prices` benefit the player has asks of them, as a percent of
; the price (rounded up, see game/state/shop_rules.gd `price`).
better_prices_percent=80
