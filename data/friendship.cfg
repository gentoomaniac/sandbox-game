; How well a villager knows the player: the ten levels of friendship (see
; game/state/friendship_rules.gd and design/villagers/relationships.md). Hand-editable; read once
; when the game starts. A level is a range of a villager's opinion of the player, in points (see
; [opinion] of data/gossip.cfg), so the points of a save never change when a level moves.

[levels]
; level_<n>=[name, first point, mood]: a level reaches from its first point to the point before
; the next level's. The first level starts at the lowest opinion (`min_points` of [opinion] of
; data/gossip.cfg). The mood is `cold`, `neutral` or `warm`: it picks the bubbles a villager
; says near the player (see game/state/npc_bubbles.gd).
level_1=["Shunned", -100, "cold"]
level_2=["Mistrusted", -60, "cold"]
level_3=["Stranger", -20, "neutral"]
level_4=["Acquaintance", 20, "warm"]
level_5=["Neighbour", 100, "warm"]
level_6=["Good neighbour", 220, "warm"]
level_7=["Friend", 380, "warm"]
level_8=["Trusted friend", 560, "warm"]
level_9=["Close friend", 740, "warm"]
level_10=["Heart's friend", 900, "warm"]

[caps]
; What the player's actions (gifts, a first chat, deeds; not what stories move, see [opinion] of
; data/gossip.cfg) move a villager's opinion in a day, in points, up and down alike. It keeps a
; gift and a deed from carrying a villager from stranger to friend in an hour.
action_daily_cap_points=60
