; Footprints: walkers leave prints on soft ground, in snow and in mud (tidal mud, and the mud
; the rain makes of worn ground, see data/paths.cfg [mud]), and they fade (see
; game/state/footprints.gd). Hand-editable; read once when the game starts. Only walkers that
; the player can see leave prints: nobody makes tracks on a chunk that is not loaded. A print
; is only a look and is not saved. Times are game minutes.

[footprints]
; How far a walker goes between two prints, in tiles: a step, the left foot and the right in turn.
step_tiles=0.45
; How far to the side of the walker's line each foot lies, in tiles: the two rows of prints are
; twice this apart.
foot_side_tiles=0.15
; The prints a chunk keeps: a new one past this overwrites the oldest. A step is under half a
; tile, so there are more than twice the prints of one a tile, which this is made for.
per_chunk=160
; How long a print lasts in snow, and in mud, in fair weather.
snow_lasts_minutes=480
mud_lasts_minutes=360
; The weather makes prints fade faster, by this much times its strength (0 to 1) on top of the
; normal pace: rain fills the prints in mud, snowfall fills those in snow, and warmth melts them
; (the thaw, as for the snow cover, see data/seasons.cfg).
mud_rain_gain=3
snow_snowfall_gain=6
snow_thaw_gain=4
