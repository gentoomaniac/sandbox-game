; What villagers do in a day: one section for each activity, [rules] for the numbers they share and
; [sets] for who has which. Hand-editable; read once when the game starts (see
; game/state/activity_rules.gd, which also reports what is wrong with the file). The plan is
; design/villagers/routines.md, "Activities and the planned day".
;
; An activity is a verb with a target: where it is done is a kind of place that is looked up for
; each villager (see game/state/activity_places.gd), never a tile in this file. An activity may
; have default times, from which a day is made when the language model has made none (see
; game/state/default_day.gd). An activity changes nothing in the world: it says where the villager
; is and how they stand there.
;
; Keys of an activity (all but `verb`, `target` and `doing` are optional):
; - verb: the words of the console and the prompt, "go to <verb>".
; - target: where, relative to the villager: home (the yard of their house), workplace (with none:
;   home), field (the nearest tilled tile or field of the village, else their workplace if that is a
;   field), church, meeting (the village's meeting place, else the church yard), friend (the yard of the house of
;   one of their `people`) and wild (a meadow spot near home, another one each day).
; - doing: what they do there: "stand" (still), "walk_about" (stroll within `radius`) or "work"
;   (stand at the spot, now and then a step, facing the work).
; - radius: how far they stroll or step from the spot, in tiles.
; - at: the default starts and lengths, [time, minutes]. A length is how long they stay at most:
;   after it they have nothing planned and keep to the yard of their home. Without `at` the
;   activity is only in a day that is planned.
; - at_days: on which of its `days` `at` holds (default: on all of them).
; - days: when it can be planned: weekday (Monday to Friday), saturday, sunday, feast (Easter and
;   Christmas, see `feasts`). Default: every day.
; - seasons: spring, summer, autumn, winter. Default: every season.
; - needs_daylight, needs_dry: in the open; between sunset and sunrise, and while it rains, the
;   villager goes home instead.
; - priority: of two default entries that start closer than `min_gap_minutes` the higher one
;   stays, and one that starts while an entry of the same or a higher priority is still on (within
;   its length) is left out of the default day.

[rules]
; A way is this much longer than the straight line (tiles along x plus tiles along y).
detour_factor=1.3
; Minutes to spare on top of the estimated walk.
arrive_margin_minutes=3
; Each villager leaves and starts up to this many minutes after the default time, a number from
; their name and the day, so that they do not all start in the same minute.
spread_minutes=10
; A villager whose way to the place is blocked for this many minutes gives the entry up and stays at
; home.
blocked_give_up_minutes=30
; It rains for an activity when the mean rain of the hour is at least this (0 to 1).
rain_hour_limit=0.25
; How far from their home a field, the church, a meeting place, a friend's house and a wild spot
; are looked for, in tiles.
search_tiles={"field": 40, "church": 200, "meeting": 200, "friend": 200, "wild": 30}
; A day has at most this many entries; two start at least this many minutes apart.
max_entries=12
min_gap_minutes=20
; Easter and Christmas as days of the year (a Sunday each), for "feast".
feasts={"easter": 14, "christmas": 140}

[sleep]
verb="sleep"
target="home"
doing="stand"
at=[["21:30", 450]]
priority=9

[breakfast]
verb="have breakfast"
target="home"
doing="stand"
at=[["05:30", 45]]
priority=7

[dinner]
verb="have dinner"
target="home"
doing="stand"
at=[["12:00", 60]]
priority=7

[supper]
verb="have supper"
target="home"
doing="stand"
at=[["18:00", 30]]
priority=7

[rest]
verb="rest"
target="home"
doing="walk_about"
radius=3.0
at=[["20:00", 90]]
priority=3

[work]
verb="work"
target="workplace"
doing="work"
radius=2.0
at=[["06:30", 330], ["13:00", 240]]
days=["weekday", "saturday"]
priority=5

[tend_field]
verb="tend the field"
target="field"
doing="work"
radius=2.0
days=["weekday", "saturday"]
needs_daylight=true
needs_dry=true
priority=4

[water_field]
verb="water the field"
target="field"
doing="work"
radius=2.0
at=[["17:00", 60]]
seasons=["spring", "summer"]
needs_daylight=true
needs_dry=true
priority=4

[milk]
verb="milk the cows"
target="workplace"
doing="work"
radius=2.0
at=[["05:00", 45], ["17:30", 45]]
priority=6

[tend_animals]
verb="tend the animals"
target="workplace"
doing="work"
radius=2.0
at=[["08:00", 60], ["14:00", 60]]
priority=5

[mend_nets]
verb="mend the nets"
target="home"
doing="work"
radius=1.5
at=[["14:00", 120]]
priority=6

[pick_flowers]
verb="pick flowers"
target="wild"
doing="walk_about"
radius=4.0
at=[["15:00", 60]]
seasons=["spring", "summer"]
needs_daylight=true
needs_dry=true
priority=2

[go_to_church]
verb="go to church"
target="church"
doing="stand"
at=[["09:30", 90]]
days=["sunday"]
priority=8

[meet_at_the_krug]
verb="meet at the Krug"
target="meeting"
doing="walk_about"
radius=4.0
at=[["18:30", 210]]
at_days=["saturday"]
days=["weekday", "saturday", "sunday"]
priority=6

[visit_friend]
verb="visit a friend"
target="friend"
doing="stand"
at=[["14:00", 120]]
days=["sunday"]
priority=6

[walk_the_village]
verb="walk about the village"
target="meeting"
doing="walk_about"
radius=6.0
needs_daylight=true
priority=1

; The activities of a villager: `base`, the set of their work (their sheet's `work_set`, or the third
; entry of their trade in data/npcs.cfg) and the extras of their sheet, minus its `skips`. Every
; activity is in some set, and `base` is everybody's.
[sets]
base=["sleep", "breakfast", "dinner", "supper", "rest", "pick_flowers", "go_to_church", "walk_the_village"]
farmer=["work", "tend_field", "water_field", "meet_at_the_krug"]
fisher=["work", "mend_nets", "meet_at_the_krug"]
craftsman=["work", "meet_at_the_krug"]
miller=["work", "meet_at_the_krug"]
keeper_of_the_house=["milk", "tend_animals"]
; For the sheets that name `visit_friend` among their extras.
visitor=["visit_friend"]
