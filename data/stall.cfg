; What the villagers do at the player's sales cart (see game/state/stall_rules.gd,
; game/state/stall_sales.gd and design/economy/README.md, "The player's stall"). Hand-editable; read
; once when the game starts. The day is rolled in one go when it ends, from a seed fixed by the day
; and the cart, so a reload and a day away give the same.

[visits]
; per_day: the most villagers who come by a cart in a day. rain_hours_limit: a day with more hours
; of rain than this brings nobody (see WeatherDay `rain_hours`).
per_day=4
rain_hours_limit=1.0

[chance]
; base_percent: how likely a villager who barters (data/barter.cfg: what they `want` is what they
; need) comes by on a fair day, before the friendship's share below.
base_percent=60

[buy]
; most_things: a visit buys one to this many things. liked_weight: how many times likelier than a
; need a good the villager likes (`gifts_liked` of data/villagers.cfg) is picked.
most_things=3
liked_weight=2

[friendship]
; By level of friendship, 1 to 10 (see data/friendship.cfg), ten numbers each.
; chance_percent: the share of the base chance: nobody who has shunned the player comes, a
;   mistrusting villager half as often, a close friend twice.
; limit_percent: the most a villager pays for a good, as a percent of its worth: the worth plus a
;   fifth, and a little more from friends. A greedy price gets a shrug.
chance_percent=[0, 50, 100, 100, 110, 120, 140, 160, 200, 200]
limit_percent=[100, 100, 120, 120, 120, 125, 125, 130, 135, 140]

[contact]
; What a sale moves a villager's opinion by, in points (within the cap of the actions, see
; data/friendship.cfg): any sale, and a sale of what they needed.
sale_points=3
needed_sale_points=10
