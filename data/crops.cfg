; Crops and the farming rules: every tunable number of growing crops. Hand-editable; read
; once when the game starts (see game/state/crop_rules.gd), which builds each crop's world
; object type and its seed and produce item types from it. A new crop is a new section here
; plus its picture sheet; no code.
;
; Every crop section is named after the crop (its world object type id) and has all of:
;   name               What the player reads for the crop and its produce, e.g. "Turnip".
;   seed_name          What the seed item is called, e.g. "Turnip seeds".
;   description        One line about the produce, shown in its tooltip.
;   sheet              Its picture sheet: 4 growth stages and then the dead one, side by side,
;                      every cell as wide as the sheet is wide / 5 and as tall as the sheet.
;                      A tall crop has a taller sheet; its bottom meets the bottom of its tile.
;   seed, produce      Item ids of the seeds ("<crop>_seeds") and of the produce, which is
;                      food (see data/energy.cfg). Their pictures are assets/items/<id>.png.
;   seed_weight,
;   produce_weight     Kilograms of one seed item and of one produce item.
;   yield              How many produce items one harvest gives (and one seed back).
;   regrow_stage       0 for a crop that is gone once harvested. Otherwise the growth stage
;                      (1 to 3) it goes back to, to ripen and be picked again.
;   ripe_wait_factor   How long a ripe crop waits for the harvest, as a multiple of the
;                      days it took to ripen (since planting, or since it regrew). One day
;                      more and it withers: it dies and gives nothing. 1 waits as long as it
;                      grew.
;   growth_per_stage   Growth points to get through one growth stage. A perfect day gives 1.
;   damage_per_bad_day Damage a bad day does (1 is dead), and
;   heal_per_good_day  what a good day takes off it again.
;   temperature_min,
;   temperature_best,
;   temperature_max    Degrees Celsius. Growth follows the day's mean temperature: none at
;                      the minimum or the maximum, full at the best. A day whose coldest
;                      hour is below the minimum is a bad day (frost).
;   sunlight_min,
;   sunlight_best      Hours of full sun in a day. Growth is the day's hours over the best
;                      (up to 1). Fewer hours than the minimum make a bad day (darkness).
;   moisture_min,
;   moisture_best      Soil moisture (0 dry to 1 soaked). Growth is the moisture over the
;                      best (up to 1). Less than the minimum makes a bad day (drought).
;   wind_max           Metres per second. A day with stronger wind than this at any hour is
;                      a bad day (wind): fragile crops have a low one.
;
; A crop's day is bad if any of the four things above is, and then it doesn't grow and takes
; damage. Otherwise it grows by the lowest of its temperature, sun and moisture scores, and
; heals if that is at least `good_day_score`.
;
; The wild reeds on the banks (see the [reeds] section below) are no crop: no seeds, no sheet,
; no planting. When the scythe has cut a stand it gathers growth by the same daily scores as
; a crop (a day's temperature and sun, but no soil: reeds stand in water) and stands again
; once it has `regrow_growth`. It has these keys, all required:
;   regrow_growth      Growth points a cut stand needs to stand again. A perfect day gives 1.
;   temperature_min,
;   temperature_best,
;   temperature_max    Degrees Celsius, as for a crop. No growth at or below the minimum, which
;                      is what keeps a stand cut in autumn from growing back through winter.
;   sunlight_min,
;   sunlight_best      Hours of full sun in a day, as for a crop. Fewer than the minimum is a
;                      day without growth.

[farming]
; The moisture of tilled soil that nothing has watered or rained on yet (and of tilled soil
; in saves from before moisture).
default_moisture=0.4
; Moisture that one hour of the heaviest rain adds.
rain_wets=0.1
; Moisture a day takes away: this much, plus this much for every degree of mean
; temperature (above 0), plus this much for every hour of full sun, plus this much for every
; metre per second of the strongest wind.
drying_base=0.04
drying_per_degree=0.005
drying_per_sun_hour=0.015
drying_per_wind=0.005
; The share of full growth from which a day is good enough to heal damage.
good_day_score=0.6
; Tilled soil with nothing on it is fallow: after this many untended days a few weeds and tufts
; of grass come up on it, and after this many it is grass again. Hoeing, sowing and watering
; tend it, and so does anything that stands on it (a crop, living or dead, too): the days count
; anew from then. A day ends at midnight.
fallow_weedy_days=5
fallow_grass_days=10
; 1: the days of winter don't count, as nothing grows over a field in the cold (a fallow field
; keeps its weeds through the winter, and grows over in the spring). 0: they count.
fallow_rests_in_winter=1

