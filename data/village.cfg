; The village every villager knows: Wehlsbüll, a made-up parish on the North Frisian coast in
; 1750. Every villager's prompt has it (see data/npc_talk.cfg and game/state/village_sheet.gd),
; so that they don't contradict each other about the pastor, the prices or this year's news. Read
; once when the game starts.
;
; One section per topic, in the order they are told. `title` heads the topic; `full` is what a
; hosted model is told (Gemini, Claude: a provider that needs a key), `short` the cut-down that a
; local model is told, kept small so that a 3B or 7B model stays fast (an empty `short` leaves the
; topic out). Write short plain sentences, true to the period: the people named here who are not
; in data/villagers.cfg (the pastor, the Deichgraf, the innkeeper) are made up too, the offices
; and the history are real.

[village]
title="The village"
full=[
	"Wehlsbüll is a small parish on the North Frisian coast, two hours on foot north of Husum, in the king's Amt of Husum in the Duchy of Schleswig.",
	"It lies where the sandy Geest meets the flat marsh; to the west the sea dyke shuts out the North Sea, and beyond it lie the salt meadows and the Wadden flats.",
	"About thirty households live here, some two hundred souls with the children and the servants.",
	"The marsh farms stand on Warften, mounds raised against the floods.",
]
short=[
	"Wehlsbüll is a small marsh parish of about thirty households on the North Frisian coast, two hours on foot north of Husum.",
]

[places]
title="Places"
full=[
	"The church stands on the highest Warft, with the churchyard round it and a wooden bell tower of its own.",
	"The parsonage is beside the church; the school is one room in the sexton's house.",
	"The Krug, the village inn, is by the church: beer, brandy and the news are had there, and carters to Husum stop there.",
	"Ocke Hansen's post mill stands on the rise at the edge of the Geest; every farmer of the parish must grind their grain there.",
	"The sea dyke runs along the west of the marsh; the sluice in it lets the ditch water out at low tide.",
	"Behind the dyke lies the Koog, the dyked marsh with its rich meadows, cattle and ditches.",
	"Outside the dyke are the salt meadows and the tidal creeks; the fishermen keep their flat boats at the landing by the sluice.",
	"On the Geest to the east are sandy fields of rye and buckwheat, heath, sheep and the peat bog.",
	"Husum is the market town, with the Amtmann's castle, the harbour and the market on Thursdays.",
]
short=[]

[people]
title="Who is who"
full=[
	"The pastor is Johann Martens, a man of about fifty-five who preaches long and in High German; his wife is Margaretha.",
	"The sexton and schoolmaster is Claus Thomsen: he rings the bell, leads the singing and keeps school in winter.",
	"The Deichgraf over the dykes of the whole district is Peter Momsen, a rich marsh farmer of the next parish; he holds the dyke inspection, the Deichschau, in spring and autumn.",
	"The Deichvogt of Wehlsbüll's own dyke is Brar Feddersen, since Jens Paulsen died three years ago.",
	"The Krug is kept by Tete Jacobsen and his wife Telse.",
	"The king's Amtmann sits in the castle at Husum, and nobody here has spoken to him; his clerk, Herr Wulff, comes for the taxes and dues at Martinmas.",
	"There is no smith, doctor or shop in Wehlsbüll: those are in Husum.",
	"Hinrich and Antje Boysen farm on their Warft in the Koog with their son Boy.",
	"Momme Ketels, the fisherman, lives by the landing with his daughter Inken.",
	"Ocke Hansen, the miller, lives in the mill house with his wife Gesche.",
	"Kerrin Paulsen, the late Deichvogt's widow, lives alone at the foot of the dyke; Gesche Hansen is her niece.",
	"Cottagers and day labourers live on the outlying farms of the Geest and along the dyke road, some of them newcomers.",
]
short=[
	"Pastor Johann Martens; the Deichgraf Peter Momsen, of the next parish; the Deichvogt Brar Feddersen.",
	"Hinrich and Antje Boysen and their son Boy farm in the Koog; Momme Ketels, the fisherman, and his daughter Inken live by the landing; Ocke Hansen, the miller, and his wife Gesche live at the mill; Kerrin Paulsen, the late Deichvogt's widow and Gesche's aunt, lives at the foot of the dyke.",
]

[money]
title="Money and prices"
full=[
	"People reckon in Mark and Schilling: 16 Schilling make a Mark, and 3 Mark a Reichstaler.",
	"A pound of butter is 4 Schilling, a dozen eggs 2, a loaf of rye bread 1, a measure of shrimp 2.",
	"A pot of beer at the Krug is 1 Schilling, a glass of brandy 2.",
	"A farmhand earns about 6 Schilling a day at the harvest and less in winter; a maid gets 12 Mark a year with her board.",
	"A good milk cow costs about 30 Mark, a sheep about 6.",
	"The miller keeps a sixteenth of the grain he grinds as his due.",
]
short=[]

[news]
title="This year's news and worries"
full=[
	"The cattle plague has been in the duchy for some years; farmers fear for their herds, and no cattle from outside may be driven in.",
	"Last autumn's storm tide broke the dyke near the sluice; the parish mended it by hand in the winter, and the Deichgraf will look at it at the spring Deichschau.",
	"By the old dyke law, whoever cannot keep up their stretch of the dyke must give up their land.",
	"Grain is dear at Husum after last year's wet harvest.",
	"The Amt must send young men to the king's land militia, and the lads fear the drawing of lots.",
	"Young men from the islands sign on with the Dutch and Hamburg whalers in spring and come home in autumn, some of them rich.",
]
short=[]

[calendar]
title="The year"
full=[
	"The church bell calls to church every Sunday; people go to confession and communion a few times a year.",
	"Candlemas, on the 2nd of February, ends the winter's work indoors; on the 21st of February, the eve of St Peter's Chair, the Biike fires burn and the whalers are seen off.",
	"Easter and Whitsun; in May the cattle go out onto the marsh meadows.",
	"Haymaking starts at St John's day, the 24th of June, and the grain harvest in August.",
	"At Michaelmas and Martinmas the rents and dues are paid, servants change masters and the cattle come in.",
	"Advent and Christmas; on Christmas Eve the old remember the flood of 1717.",
]
short=[]

[world]
title="What people know of the world"
full=[
	"The King of Denmark, Frederik V, rules the Duchy of Schleswig; since 1721 he holds all of it, and the Duke of Gottorf keeps only his part of Holstein, at Kiel.",
	"Among themselves people speak North Frisian or Low German; the pastor preaches and the officials write in High German; Danish is the king's language, heard from soldiers and traders.",
	"Husum, Tönning and Flensburg are the towns people know; Hamburg is far away, and Copenhagen is the king's city across the sea.",
	"The great flood of 1634 drowned the old island of Strand, of which Pellworm and Nordstrand are left; the Christmas flood of 1717 is remembered by the old.",
	"People are Lutheran; most can read the catechism and the hymn book, few can write.",
]
short=[]
