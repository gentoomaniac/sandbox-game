; Desire paths: grass that is walked often wears to a path, and grows back when it is left.
; Hand-editable; read once when the game starts (see game/state/path_rules.gd). Only grass
; (ordinary, lush and dry) and the floodplain wear; fields, wetland, water, buildings and the
; insides of houses don't. A path is a look only: it walks, tills and builds like grass.
;
; Wear is counted in steps: every tile the player steps onto takes one more (animals and
; villagers less, see below). A night takes
; `regrowth_per_night` off every worn tile, so a line walked a few times a day turns trodden
; after a day or two and into a path after a few days, and a path left alone is grass again
; after about two weeks.

[wear]
; From this many steps a tile is trodden: thinner, patchy grass.
trodden_from=8
; From this many steps it is a path of bare earth.
path_from=24
; The wear stops growing here, so even a path walked for a season grows back in two weeks.
most=32
; The steps a night takes off every worn tile.
regrowth_per_night=2
; The steps a farm animal wears onto a tile it walks onto (0: animals make no tracks).
animal_step=0.5
; The steps a villager wears onto a tile it walks onto (0: villagers make no tracks). They
; stroll about their yard and go their rounds all day, so this is low.
villager_step=0.5
