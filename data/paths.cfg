; Desire paths: grass that is walked often wears to a path, and grows back when it is left.
; Hand-editable; read once when the game starts (see game/state/path_rules.gd). Only grass
; (ordinary, lush and dry) and the floodplain wear; fields, wetland, water, buildings and the
; insides of houses don't. A path is a look only: it walks, tills and builds like grass.
;
; Wear needs time as well as steps. Every tile the player steps onto takes a step (animals and
; villagers less, see below), and a day on which a tile took enough of them is a busy day. A tile
; that has had busy days in a row turns trodden, and one that has had more of them a path. The days
; are counted at midnight (see NightUpkeep), so a tile never changes its look in the middle of a
; day. A quiet day takes days off the count, so a path that is left alone is grass again after
; about two weeks, going back through trodden grass on the way.

[wear]
; The steps a tile needs in a day for the day to be busy.
busy_steps=10
; From this many busy days (counted as above) a tile is trodden: thinner, patchy grass.
trodden_after_days=3
; From this many it is a path of bare earth.
path_after_days=8
; The count stops here, so even a path walked for a season grows back in this many quiet days.
most_days=12
; The days a quiet day takes off the count.
quiet_day_loss=1
; The steps a farm animal wears onto a tile it walks onto (0: animals make no tracks).
animal_step=0.5
; The steps a villager wears onto a tile it walks onto (0: villagers make no tracks). They
; stroll about their yard and go their rounds all day, so this is low. Twenty such steps make a
; busy day.
villager_step=0.5

[mud]
; Worn ground (trodden grass and paths) turns to mud in the rain, and dries out again. It is mud
; when it rained this much (the rain of each hour, 0 to 1, added up: a downpour is 1 an hour, a
; drizzle 0.1) in the last `window_hours`, so a shower of an hour or two does not make mud and
; one of a few hours does, and the mud dries out `window_hours` after the rain stopped.
soaked_by=1.5
window_hours=10
; The player walks at this fraction of their speed on mud (1: mud does not slow).
walk_factor=0.7

[wading]
; The player wades into flooded tidal mud from dry ground, at this fraction of their speed (1:
; flooded mud does not slow). Villagers and animals keep out of it, and so does a horse.
walk_factor=0.3
