; Crows eating crops: what a visiting flock takes from the fields near it, and how much at most.
; Hand-editable; read once when the game starts (see game/state/crop_raid_rules.gd). Where the
; crows are and when they come is in data/wildlife.cfg ([crows]).
;
; A flock raids once an hour at most, by the clock, and only while it is in a loaded chunk and
; the player is far enough off: the crows flee the player. A raid tries a few of the crops within
; reach of the flock, the living ones that no scarecrow guards. Each crop tried loses something by
; the chance of its growth stage: a seed or a sprout is eaten whole, a growing or ripe plant has a
; produce item eaten off its harvest (see CropLife `eaten`), unless it would then give only one.
; Caps per day keep a field from being stripped.

[raids]
; No raid while the player is this near the flock, in tiles (more than the crows' flee_tiles:
; they come back to the field only when it is quiet).
player_tiles=12.0
; The chance per game hour that a flock raids at all.
hour_chance=0.4
; A raid tries the crops within this many tiles of the flock, and at most this many of them.
reach_tiles=3
crops_per_raid=2
; The chance that a crop tried loses something, by its growth stage (seed, young, grown, ripe).
stage_chances=[0.5, 0.15, 0.15, 0.3]
; Up to this growth stage (0 is the seed) a crop is eaten whole; a later one loses produce.
whole_up_to_stage=0
; The most the crows eat in a day, in the whole world: whole plants, and produce items.
max_plants_per_day=2
max_items_per_day=6
; Sown seed draws crows: the chance that a crow flock appears is this much more (a share of the
; normal chance) for every crop within `sown_radius_tiles` of the spot that has only just been
; sown (growth stage 0), up to `sown_boost_max` times the normal (see CropRaids `appearing_boost`).
sown_boost_per_crop=0.1
sown_boost_max=3.0
sown_radius_tiles=6
