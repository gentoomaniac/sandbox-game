; Leaves that fall and blow in the wind. Hand-editable; read once when the game starts (see
; game/state/leaf_fall_rules.gd and game/scenes/falling_leaves.gd). View only, nothing is saved.
;
; The game does not look at every tree: `tries_per_second` tiles are picked at random around the
; player, and a pick that lands on a tree may shed a leaf. So the number of leaves follows how
; thick the wood is, how late in the season, and how hard the wind blows. Indoors none fall.

[shedding]
; Tiles picked per second, within this many tiles of the player to either side (about what the
; widest view shows).
tries_per_second=400.0
radius_tiles=Vector2(20, 11)
; The most leaves in the air at once; a tree sheds nothing while there are this many.
max_leaves=24
; The chance that a pick on a tree in full autumn sheds a leaf, in wind of `full_speed` (m/s)
; or more. It falls to 0 at `calm_speed` and below: no wind, no leaves.
shed_chance=1.0
calm_speed=3.0
full_speed=12.0
; A gust front passing over a tree (the fronts of the swaying plants, see sway.gdshaderinc)
; multiplies the chance by up to this much more.
gust_gain=3.0

[season]
; How much a tree sheds by the foliage it has, as a share of `shed_chance`. Trees in their autumn
; colours shed fully, and so do those that still have them in early winter (the foliage blend of
; data/seasons.cfg turns them bare tree by tree). Green trees shed a little from this day of the
; year (1 to 120; summer is 31 to 60) on. Bare, budding and young leaves shed none.
autumn_share=1.0
late_summer_share=0.15
late_summer_from_day=50
; Spruce and pine drop a rare needle, in any season (not under snow).
needle_share=0.04

[fall]
; A leaf that drops beside its tree: it starts within `spread` pixels of the canopy's middle
; (half the size of the area), falls at a speed between the two `fall_speed` values (pixels per
; second), is pushed `sideways` pixels per second either way, swings `sway` pixels to the sides,
; and fades out after `life` seconds.
spread=Vector2(24, 10)
fall_speed=Vector2(22, 34)
sideways=6.0
sway=5.0
life=2.5

[carried]
; In wind a shed leaf may be carried off instead: the chance is `chance` at full wind and less in
; lighter wind. It drifts downwind at `drift_per_wind` pixels per second for every m/s, falls
; slower than a dropped leaf, swings `sway` pixels to the sides, tumbles `tumble` pixels up and
; down, and fades out after `life` seconds, which is far enough to leave the view.
chance=0.6
drift_per_wind=6.0
fall_speed=Vector2(8, 20)
sway=7.0
tumble=4.0
life=4.5
