; The game's music. Hand-editable; read once when the game starts (see game/audio/music_rules.gd).
; Pieces are the files of assets/music/ (tools/music/pieces/), called by their names without the
; extension.

[everyday]
; The pieces that play when nothing else asks for music, one after the other, round and round.
pieces=["sketch_tide", "sketch_harbour"]
; How many times a piece loops before the next one crossfades in, on its next beat.
loops_before_switch=3

[fades]
; How long a crossfade from one piece to the next lasts, and how long the music takes to fade out
; when it is stopped.
crossfade_seconds=4.0
stop_seconds=2.0

[cache]
; The most the renders kept in user://music_cache/ may take together, in megabytes. A piece at
; 44.1 kHz stereo takes about 10 MB a minute (Tide 5.6, Harbour evening 4.2); the oldest renders go
; first.
max_megabytes=64
