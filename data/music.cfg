; The game's music. Hand-editable; read once when the game starts (see game/audio/music_rules.gd).
; Pieces are the files of assets/music/ (tools/music/pieces/), called by their names without the
; extension.

[everyday]
; The pieces that play when nothing else asks for music (see game/audio/music_director.gd): those
; that fit the hour (their `hours` below), one after the other, round and round.
pieces=["sketch_tide", "sketch_harbour"]
; How long a piece plays at least before another may take over, in seconds (of real time). Then a
; piece that no longer fits the hour gives way to one that does, on its next bar.
min_seconds=90.0
; How long a piece that fits plays before the next that fits too crossfades in.
switch_seconds=180.0

; A piece's own section, [piece.<name>]:
; form: the sections of the piece (its .cfg) it plays one after the other, round and round, each
;   followed by one it exits to; without a form the piece loops its first section. A fill put after
;   some loops plays now and then and leads back into the loop on the bar.
; hours: when it fits, from and to the hour of the game's clock, the second not included (from 15
;   to 7 runs over midnight); without hours it always fits.

[piece.sketch_tide]
; By day: on its own from 7 to 15, turn about with Harbour evening in the evening and at dawn.
form=["loop"]
hours=[4, 22]

[piece.sketch_harbour]
; Three loops of 24 s and the fill of a bar (3 s): 75 s round.
form=["loop", "loop", "loop", "fill"]
; From the afternoon through the night (on its own from 22 to 4) to the early morning.
hours=[15, 7]

[indoors]
; The quieter mix inside a building: the share of its volume each channel plays at, the lead
; (sawtooth), the chords (pulse), the bass or drone (triangle) and the drum or the sea (noise),
; the last silent where the sea is outside. It blends in over fade_seconds as the player passes
; the door, in step with the music, and back on the way out.
channel_levels=[0.4, 0.55, 0.6, 0.0]
fade_seconds=1.5

[versions]
; Each piece in two versions (#15): the chiptune of its file with the classic 16 px art, and the
; fuller version, <name>_full of assets/music/ (more channels, softer instruments), with the 32 px
; art, where it has one. When the art changes, the other version is rendered and blends in on the
; next bar, in step, over fade_seconds. The cache below then holds the renders of both.
fade_seconds=3.0

[fades]
; How long a crossfade from one piece to the next lasts, and how long the music takes to fade out
; when it is stopped.
crossfade_seconds=4.0
stop_seconds=2.0

[cache]
; The most the renders kept in user://music_cache/ may take together, in megabytes. A piece at
; 44.1 kHz stereo takes about 10 MB a minute (Tide 5.6, Harbour evening 13.2 with its fill); the
; oldest renders go first.
max_megabytes=64
