; Energy and health: every tunable number of the energy system. Hand-editable; read once when
; the game starts (see game/state/energy_rules.gd). Energy and health run from 0 to their
; maximum, which attributes.cfg sets: 100 for a new character, so a value in points is also a
; value in percent of the bar.

[cost]
; Energy one use costs, before the weight and drain factors.
; A hoe tilling grass.
till=2.0
; One swing of an axe or pickaxe at a tree or rock.
hit=2.0
; The watering can wetting a tilled tile.
water=2.0
; Planting seeds or a sapling.
plant=0.5
; Harvesting a crop or picking a bush by hand.
pick=0.5
; One swing of the scythe that mows something.
mow=2.0
; The shovel digging in grass.
dig=2.0
; Eating and walking cost nothing.

[can]
; The watering can holds this much water (task 122). Wetting a tile of tilled soil takes 1 and
; pouring into a trough takes 1; the player fills it at a draw well or from fresh water (a river,
; a pond, a ditch), up to this much. A new game starts with it full.
capacity=20

[weight]
; Carried weight up to this many kilograms costs nothing extra (tools weigh nothing).
free_kg=40.0
; Above that, every this many kilograms ...
step_kg=10.0
; ... raise the cost of a use by this fraction (0.1 is +10 %), growing linearly.
extra_per_step=0.1

[sleep]
; The share of the energy and health bars, in percent, that sleeping fills up to, by bed (the
; object's type id).
; The bedroll at the camp (a straw sack and a wool blanket; the id is older).
sleeping_bag=100.0
; The small bed inside a house.
small_bed=100.0
; The straw mat in a shack.
sleeping_mat=80.0
; The box bed in a longhouse.
box_bed=100.0
; Sleeping on the ground without a bed (not in the game yet).
ground=50.0

[food]
; Energy that eating one of an item restores. Only items listed here can be eaten.
berries=3.0
turnip=8.0
potato=10.0
carrot=6.0
cabbage=10.0
onion=4.0
peas=4.0
beans=4.0
strawberries=5.0
pumpkin=12.0
; Cooked food (task 74) gives more than what it is made of would, eaten raw.
roast_turnip=12.0
; One cabbage, carrot and onion make two bowls.
pottage=15.0
; Four peas and an onion make two bowls.
pea_soup=16.0
; Three buckwheat make two.
buckwheat_pancakes=14.0
bread=30.0
berry_tart=35.0
feast_cake=60.0

[walk]
; At this much energy or less (points) the player walks at slow_speed times full speed ...
slow_energy=10.0
slow_speed=0.75
; ... and below this much energy at very_slow_speed times full speed.
very_slow_energy=5.0
very_slow_speed=0.5

[debuff]
; After passing out, until the next new day: walking speed factor, the most energy the
; player can have, and the health they wake up with.
walk_speed=0.5
energy_max=50.0
health=25.0

[bars]
; At this much energy or health or less, the bar in the HUD pulses.
warning=20.0

[signs]
; At this much energy or less (points) the player shows signs of tiredness: a "zzz..." bubble
; once when energy falls to the first level, once more at the second, and sweat on every
; action while at or below the first level (more at or below the second).
tired=20.0
exhausted=10.0
; The same "zzz..." bubble warns of staying up too late, at these minutes after midnight (00:00
; and 00:30), while the player is awake: passing out follows an hour after midnight.
late_first_minute=0.0
late_second_minute=30.0
