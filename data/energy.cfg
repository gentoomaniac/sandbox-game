; Energy and health: every tunable number of the energy system. Hand-editable; read once when
; the game starts (see game/state/energy_rules.gd). Energy and health run from 0 to 100, so
; a value in points is also a value in percent of the bar.

[cost]
; Energy one use costs, before the weight and drain factors.
; A hoe tilling grass.
till=2.0
; One swing of an axe or pickaxe at a tree or rock.
hit=2.0
; The watering can wetting a tilled tile.
water=2.0
; Planting seeds or a sapling.
plant=0.5
; Harvesting a crop or picking a bush by hand.
pick=0.5
; One swing of the scythe that mows something.
mow=2.0
; The shovel digging in grass.
dig=2.0
; Eating and walking cost nothing.

[weight]
; Carried weight up to this many kilograms costs nothing extra.
free_kg=20.0
; Above that, every this many kilograms ...
step_kg=10.0
; ... raise the cost of a use by this fraction (0.1 is +10 %), growing linearly.
extra_per_step=0.1

[sleep]
; Energy and health in points that sleeping fills up to, by bed (the object's type id).
; The sleeping bag at the camp.
sleeping_bag=100.0
; The small bed inside a house.
small_bed=100.0
; The straw mat in a shack.
sleeping_mat=80.0
; The box bed in a longhouse.
box_bed=100.0
; Sleeping on the ground without a bed (not in the game yet).
ground=50.0

[food]
; Energy that eating one of an item restores. Only items listed here can be eaten.
berries=3.0
turnip=8.0
potato=10.0
carrot=6.0
cabbage=10.0
onion=4.0
peas=4.0
beans=4.0
tomatoes=5.0
strawberries=5.0
pumpkin=12.0

[walk]
; At this much energy or less (points) the player walks at slow_speed times full speed ...
slow_energy=10.0
slow_speed=0.75
; ... and below this much energy at very_slow_speed times full speed.
very_slow_energy=5.0
very_slow_speed=0.5

[debuff]
; After passing out, until the next new day: walking speed factor, the most energy the
; player can have, and the health they wake up with.
walk_speed=0.5
energy_max=50.0
health=25.0

[bars]
; At this much energy or health or less, the bar in the HUD pulses.
warning=20.0
