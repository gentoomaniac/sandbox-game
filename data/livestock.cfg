; Livestock: the farm animals of the world, how they look and how they behave. Hand-editable;
; read once when the game starts (see game/state/livestock_rules.gd). Distances are in tiles,
; speeds in tiles per second, times in real seconds.
;
; An awake animal stands idle, walks, grazes (chickens peck for seeds and worms) or runs about;
; when one is done, the next is drawn by `activity_weights`. It walks only onto ground it can
; stand on. At night it sleeps where it is.

[general]
; It stops running from the player this many tiles beyond its `flee_tiles`.
calm_extra_tiles=2.0
; Each animal goes to sleep and wakes up to this many minutes later than its species, so that a
; herd doesn't lie down all at once.
bedtime_spread_minutes=30.0
; A dog given a bone follows the player for this many game minutes, day and night.
follow_minutes=180
; It waits while it is within `follow_far_tiles` of the player; further off, it walks after them
; (runs, beyond `follow_run_tiles`) until it is `follow_near_tiles` from them.
follow_near_tiles=1.0
follow_far_tiles=2.0
follow_run_tiles=4.0
; Left further behind than this, or stuck behind something for this many seconds, it is put
; beside the player.
follow_lost_tiles=15.0
; A skip of time too long to walk through (see Simulation `skip`) leaves each animal at a random
; spot this many tiles at the most from where it was, doing what its time of day has it doing.
catch_up_wander_tiles=6.0
follow_stuck_seconds=2.0
; A saddled horse the player rides walks at this many times the player's walking speed, and once
; they have ridden on for `trot_after_seconds` it trots at `ride_trot_factor` times it. Riding
; costs no energy, and tiredness doesn't slow the horse.
ride_walk_factor=1.0
ride_trot_factor=2.0
trot_after_seconds=0.6

; A cat that sees a mouse when it picks what to do next hunts it: it crouches, creeps up and
; pounces. Only cats hunt, and only mice; mice come out mostly at dusk and at night.
[hunting]
; It sees a mouse this many tiles from it.
sight_tiles=3.5
; It crouches this long before it creeps up.
crouch_seconds=1.5
creep_speed=0.3
; It gives up a mouse it hasn't come near enough to pounce on in this many seconds.
give_up_seconds=12.0
; It pounces from this many tiles, leaping at `pounce_speed`.
pounce_tiles=1.2
pounce_speed=3.5
; About half its pounces catch the mouse: the others are seen coming, and the mouse dashes off
; into cover as the cat leaps. A catching pounce takes a mouse still within `catch_tiles` of where
; the cat lands.
catch_chance=0.5
catch_tiles=0.5
; After a hunt it rests this long before it hunts again.
rest_seconds=60.0

; Petting (task 173, decided 2026-11-11): the use key with an empty hand at an animal. The first
; petting of a day while it is awake adds `pet_gain` to its friendship (0 to `max`) and shows a heart
; over its head; more that day change nothing. Petting it while it sleeps takes `sleep_pet_loss`
; and shows an anger mark, once a day too, and does not count as the day's petting. Each day with no
; (awake) petting takes `daily_loss`. The value never goes below 0. Only `pettable` species can be
; petted (the wild animals cannot); a new animal starts at 0. Nothing uses the
; friendship yet.
[friendship]
pettable=["cow", "horse", "sheep", "pig", "chicken", "rabbit", "dog", "cat"]
max=100
pet_gain=10
sleep_pet_loss=5
daily_loss=5

; The needs of the animals (task 122; they rise with game time, are saved and have no other effect
; yet). Each animal gets hungry and thirsty; when a need reaches `seek_at` it looks, when it next
; picks what to do, for what meets it within `search_tiles` of where it stands that it can walk to:
; fresh water (a river, a pond, a ditch; never the sea, the tidal mud or the salt marsh) or a
; trough with water for thirst, a hay rack with feed for hunger. It stands there with its head down
; for `drink_seconds` or `eat_seconds`, and the need is 0 again. A search that finds nothing is not
; tried again for `retry_seconds`. An animal that grazes also eats while it grazes: its hunger
; falls by `graze_relief_per_second` a second. A skip of time (sleeping) puts an animal that could
; reach what it needs among its meals (see Livestock `catch_up`).
[needs]
seek_at=0.5
search_tiles=10.0
drink_seconds=3.0
eat_seconds=4.0
retry_seconds=30.0
graze_relief_per_second=0.003
; The longest an animal walks to what it needs before it gives up, in seconds.
trip_seconds=30.0
; Looking for what it needs (or for a coop) is a flood fill of the ground round an animal, so no
; more than this many are made in one update of the animals, which spreads a herd's searches over
; frames; an animal that did not get one tries when it next picks what to do.
searches_per_update=2

; The farm yard (task 122): how the player fills the trough and the hay rack. A trough and a
; hay rack hold up to 100 units (see WorldObjectTypes).
[yard]
; One pour of the watering can puts this many units of water into a trough.
pour_units=10
; Feed the player puts into a hay rack or a feeding trough (any stock of feed) by the item: units
; per item. Acorns, beech mast and turnips are the pigs' old food (task 165); any that eat feed eat
; them.
feed_items={"hay": 10, "turnip": 8, "acorn": 4, "beechnut": 4}

; The chicken coop (task 122; see the building in data/buildings.cfg). When it is time to sleep, a
; hen within `call_tiles` of a coop that has a free roost walks to its door and goes in, and sleeps
; in it until the morning, when she comes out; she is not shown while she is in. Going in she lays an
; egg with the chance `egg_chance` in a nest of the coop that has room: the nests are the hay piles
; of its inside, each holding up to `nest_eggs` eggs until the player takes them (the use key with
; an empty hand at the nest). A skip of time that lasts over a hen's bedtime counts that night's egg.
[coop]
building="chicken_coop"
roosts=6
call_tiles=12.0
egg_chance=0.7
nest_eggs=4

; The rooster (task 204): the chicken of the look `rooster`. A flock (the chickens that stand within
; `flock_tiles` of one another and of a coop, see ChickenFlocks) has exactly one. It is never drawn as a
; random look (`look_weights` of the chicken above), but comes with a flock's hens (`spawn chicken`,
; the save upgrade) or by `spawn rooster`. It does what the hens do and lays no eggs.
[rooster]
flock_tiles=12.0

; Keys of every species:
;   looks             the names of its pictures (assets/wildlife/<species>_<look>.png)
;   look_weights      how often each look is drawn for a new animal, in the order of `looks`
;   tints             colours its picture is multiplied by, one drawn for each animal so that no
;                     two look quite alike; "ffffff" leaves the picture as it is
;   activity_weights  idle, walk, graze, run: how often it picks each when the last is done
;   idle_seconds      [shortest, longest] standing still
;   walk_seconds      [shortest, longest] walking
;   graze_seconds     [shortest, longest] grazing (pecking, for chickens)
;   run_seconds       [shortest, longest] running about
;   walk_speed        while it wanders
;   body_tiles        from its feet to the tip of its nose: the ground there must be free too
;   flee_tiles        it runs from the player when they are this near (0: never)
;   run_speed         while it runs (about, or from the player)
;   sleep_minutes     it lies down this many minutes after sunset (before it, if negative)
;   wake_minutes      it gets up this many minutes after sunrise (before it, if negative)
;   hunger_hours      game hours from fed to as hungry as it gets (1.0); it just rises, with no harm
;   thirst_hours      the same for thirst
;   grazes_for_food   grazing (pecking, for hens) feeds it: its hunger falls while it grazes (a dog or a
;                     cat sniffs about and eats nothing there)
;   eats_feed         it eats the feed of a hay rack (a stock of kind feed); a hen eats grain and a dog or
;                     cat meat, which have no feeder yet
;   eat_units         what one meal takes out of the stock of feed
;   drink_units       what one drink takes out of the stock of water

[cow]
looks=["angler", "black_pied", "red_pied"]
look_weights=[2.0, 2.0, 1.0]
tints=["ffffff", "f4e8dc", "e6dcd2", "fff2e4", "dcd4cc"]
activity_weights=[0.3, 0.25, 0.45, 0.0]
idle_seconds=[2.0, 6.0]
walk_seconds=[1.5, 4.0]
graze_seconds=[4.0, 10.0]
run_seconds=[1.0, 2.0]
walk_speed=0.5
body_tiles=0.7
flee_tiles=0.0
run_speed=0.0
sleep_minutes=60.0
wake_minutes=-30.0
hunger_hours=12.0
thirst_hours=8.0
grazes_for_food=true
eats_feed=true
eat_units=5
drink_units=5

