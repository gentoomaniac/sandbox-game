look_weights=[3.0, 2.0, 1.0]
activity_weights=[0.25, 0.35, 0.4]
idle_seconds=[1.0, 3.0]
walk_seconds=[0.8, 2.5]
graze_seconds=[1.5, 4.0]
walk_speed=0.8
body_tiles=0.2
flee_tiles=0.0
flee_speed=0.0

[rabbit]
