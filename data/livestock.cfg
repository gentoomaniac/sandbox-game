; Livestock: the farm animals of the world, how they look and how they behave. Hand-editable;
; read once when the game starts (see game/state/livestock_rules.gd). Distances are in tiles,
; speeds in tiles per second, times in real seconds.
;
; An awake animal stands idle, walks, grazes (chickens peck for seeds and worms) or runs about;
; when one is done, the next is drawn by `activity_weights`. It walks only onto ground it can
; stand on. At night it sleeps where it is.

[general]
; It stops running from the player this many tiles beyond its `flee_tiles`.
calm_extra_tiles=2.0
; Each animal goes to sleep and wakes up to this many minutes later than its species, so that a
; herd doesn't lie down all at once.
bedtime_spread_minutes=30.0
; A dog given a bone follows the player for this many game minutes, day and night.
follow_minutes=180
; It waits while it is within `follow_far_tiles` of the player; further off, it walks after them
; (runs, beyond `follow_run_tiles`) until it is `follow_near_tiles` from them.
follow_near_tiles=1.0
follow_far_tiles=2.0
follow_run_tiles=4.0
; Left further behind than this, or stuck behind something for this many seconds, it is put
; beside the player.
follow_lost_tiles=15.0
; A skip of time too long to walk through (see Simulation `skip`) leaves each animal at a random
; spot this many tiles at the most from where it was, doing what its time of day has it doing.
catch_up_wander_tiles=6.0
follow_stuck_seconds=2.0
; A saddled horse the player rides walks at this many times the player's walking speed, and once
; they have ridden on for `trot_after_seconds` it trots at `ride_trot_factor` times it. Riding
; costs no energy, and tiredness doesn't slow the horse.
ride_walk_factor=1.0
ride_trot_factor=2.0
trot_after_seconds=0.6

; A cat that sees a mouse when it picks what to do next hunts it: it crouches, creeps up and
; pounces. Only cats hunt, and only mice; mice come out mostly at dusk and at night.
[hunting]
; It sees a mouse this many tiles from it.
sight_tiles=3.5
; It crouches this long before it creeps up.
crouch_seconds=1.5
creep_speed=0.3
; It gives up a mouse it hasn't come near enough to pounce on in this many seconds.
give_up_seconds=12.0
; It pounces from this many tiles, leaping at `pounce_speed`.
pounce_tiles=1.2
pounce_speed=3.5
; About half its pounces catch the mouse: the others are seen coming, and the mouse dashes off
; into cover as the cat leaps. A catching pounce takes a mouse still within `catch_tiles` of where
; the cat lands.
catch_chance=0.5
catch_tiles=0.5
; After a hunt it rests this long before it hunts again.
rest_seconds=60.0

; The farm yard (task 122): how the player fills the trough and the hay rack. A trough and a
; hay rack hold up to 100 units (see WorldObjectTypes).
[yard]
; One pour of the watering can puts this many units of water into a trough.
pour_units=10
; Feed the player puts into a hay rack (or any stock of feed) by the item: units per item.
feed_items={"hay": 10}

; Keys of every species:
;   looks             the names of its pictures (assets/wildlife/<species>_<look>.png)
;   look_weights      how often each look is drawn for a new animal, in the order of `looks`
;   tints             colours its picture is multiplied by, one drawn for each animal so that no
;                     two look quite alike; "ffffff" leaves the picture as it is
;   activity_weights  idle, walk, graze, run: how often it picks each when the last is done
;   idle_seconds      [shortest, longest] standing still
;   walk_seconds      [shortest, longest] walking
;   graze_seconds     [shortest, longest] grazing (pecking, for chickens)
;   run_seconds       [shortest, longest] running about
;   walk_speed        while it wanders
;   body_tiles        from its feet to the tip of its nose: the ground there must be free too
;   flee_tiles        it runs from the player when they are this near (0: never)
;   run_speed         while it runs (about, or from the player)
;   sleep_minutes     it lies down this many minutes after sunset (before it, if negative)
;   wake_minutes      it gets up this many minutes after sunrise (before it, if negative)

[cow]
looks=["angler", "black_pied", "red_pied"]
look_weights=[2.0, 2.0, 1.0]
tints=["ffffff", "f4e8dc", "e6dcd2", "fff2e4", "dcd4cc"]
activity_weights=[0.3, 0.25, 0.45, 0.0]
idle_seconds=[2.0, 6.0]
walk_seconds=[1.5, 4.0]
graze_seconds=[4.0, 10.0]
run_seconds=[1.0, 2.0]
walk_speed=0.5
body_tiles=0.7
flee_tiles=0.0
run_speed=0.0
sleep_minutes=60.0
wake_minutes=-30.0

[sheep]
looks=["white", "grey", "black_faced"]
look_weights=[2.0, 2.0, 1.0]
