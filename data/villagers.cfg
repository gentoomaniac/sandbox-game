habits="Looks at the sky before he answers anything. Chews a stalk of grass."
avoids="Won't talk about money with strangers, or about the dead child. Can write his name and read the almanac, no more; knows nothing of Copenhagen or the king's affairs."
secrets="He lent Momme the money for his new boat without telling Antje. He fears the cattle plague more than any storm tide."

