; Stations: the objects the player crafts at (task 74). Hand-editable; read once when the game
; starts (see game/state/station_rules.gd). E on one of them opens the crafting menu with the
; recipes of recipes.cfg that name the station; C opens it for the recipes made by hand.
;
; Every section is a station, named after its id (a recipe names it in `station`), with:
;   name     The title of its menu.
;   objects  The world object types that are this station (ids of WorldObjectTypes), at least
;            one; an object type is at most one station.
; and, for a process station (task 199: a grid the player loads, a button that starts the run of
; the recipe it holds, which takes the recipe's `hours`; see game/state/process_station.gd):
;   process      true. Without it the station opens the crafting menu of its recipes.
;   grid         The columns and rows of its grid, Vector2i(3, 3); saved with the station.
;   button_icon  The picture on its activation button, assets/ui/process_<button_icon>.png (drawn
;                in tools/art/ui.py): "fire".

[workbench]
; Placed by the player, outdoors or in a house.
name="Workbench"
objects=["workbench"]

[kiln]
; Placed by the player, outdoors only. Fires raw bricks with logs.
name="Kiln"
objects=["kiln"]
process=true
grid=Vector2i(3, 3)
button_icon="fire"

[oven]
; Placed by the player, outdoors or in a house; built of the mason's bricks.
name="Bake oven"
objects=["oven"]
process=true
grid=Vector2i(3, 3)
button_icon="fire"

[hearth]
; The hearth of a house, and the campfire: basic cooking, which everyone can do.
name="Hearth"
objects=["hearth", "fireplace"]
