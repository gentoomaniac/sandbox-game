; The worked land: the field boundaries, the marsh ditches, the dykes and the willows the world
; generator lays over the terrain. Hand-editable; read once when the game starts (see
; game/state/landscape_rules.gd and game/world/field_layout.gd). Sizes are in tiles, chances
; and shares from 0 to 1.
;
; The land is cut into fields: rows of fields between straight boundaries running east-west,
; each row cut into fields by boundaries running north-south. Every stretch of boundary (between
; two that cross it) has one gap in it, a gate or a crossing, so no field is shut in. On the Geest
; (dry grass away from the river) a boundary is a Knick, a fieldstone wall or a wattle fence; in
; the marsh and on wetland it is a ditch of water. There are none in forests, on the floodplain or
; in the river.

[fields]
; How far apart the east-west boundaries are, and by how much more each one lies further south
; (at most).
row_height=13
row_jitter=4
; How far apart the north-south boundaries of a row are, and by how much more each lies further
; east (at most).
field_width=18
field_jitter=6
; The share of the stretches of boundary that are there; the others are left out, so some fields
; run together.
boundary_chance=0.8

[kinds]
; What a stretch of boundary on the Geest is, as shares (they need not add up to 1).
knick=0.8
stone_wall=0.1
wattle_fence=0.1

[marsh]
; How far from the floodplain's edge the marsh reaches: the low land by the river, drained by
; ditches instead of fenced.
reach=36

[dykes]
; Dykes run along the floodplain's edge, on the land side, in stretches: where a slow noise
; along the river is above this (-1 to 1; lower means more dyke).
stretch_above=-0.3

[ditches]
; Beside a ditch in the marsh: the chance of a pollard willow on a tile, and of reeds.
willow_chance=0.1
reeds_chance=0.3
