; The worked land: the field boundaries, the marsh ditches, the dykes and the willows the world
; generator lays over the terrain. Hand-editable; read once when the game starts (see
; game/state/landscape_rules.gd and game/world/field_layout.gd). Sizes are in tiles, chances
; and shares from 0 to 1.
;
; The land is cut into fields: rows of fields between straight boundaries running east-west,
; each row cut into fields by boundaries running north-south. Every stretch of boundary (between
; two that cross it) has one gap in it, a gate or a crossing, so no field is shut in. On the Geest
; (dry grass away from the river) a boundary is a Knick, a fieldstone wall or a wattle fence; in
; the marsh and on wetland it is a ditch of water. There are none in forests, on the floodplain or
; in the river.
;
; In the west the land ends at the North Sea: a sea dyke runs along the coast, and beyond it lie
; the salt marsh, the tidal mud with its tideways, and the open sea.

[fields]
; How far apart the east-west boundaries are, and by how much more each one lies further south
; (at most).
row_height=13
row_jitter=4
; How far apart the north-south boundaries of a row are, and by how much more each lies further
; east (at most).
field_width=18
field_jitter=6
; The share of the stretches of boundary that are there; the others are left out, so some fields
; run together.
boundary_chance=0.8

[kinds]
; What a stretch of boundary on the Geest is, as shares (they need not add up to 1).
knick=0.8
stone_wall=0.1
wattle_fence=0.1

[marsh]
; How far from the floodplain's edge, and from the sea dyke, the marsh reaches: the low land by the
; river and the coast, drained by ditches instead of fenced.
reach=36

[dykes]
; Dykes run along the floodplain's edge, on the land side, in stretches: where a slow noise
; along the river is above this (-1 to 1; lower means more dyke).
stretch_above=-0.3

[coast]
; The coast line runs north to south, wandering: the land lies east of it, the first tiles of land
; carry the sea dyke. line_x is where it runs on average (a world x; the world spans -1024 to
; 1023), and it wanders up to `wander` tiles east and west of that.
line_x=-260
wander=40
; West of the dyke: the salt marsh, `salt_marsh_width` tiles wide on average, give or take
; `salt_marsh_wander`; then the tidal mud, out to `flats_width` tiles from the salt marsh on
; average (give or take a third of it); then the open sea.
salt_marsh_width=12
salt_marsh_wander=5
flats_width=140

[tideways]
; Tideways (Priele) wind through the mud out to the sea, one in every `spacing` tiles from north
; to south, each up to `meander` tiles either side of its middle. They start a tile wide at the
; salt marsh, or a little further out, and widen by `widening` tiles per tile out to `widest`.
; Twice the meander and the widest must stay below the spacing, so they never run together.
spacing=36
meander=11
widening=0.06
widest=7

[warften]
; A Warft (dwelling mound) stands out on the salt marsh in one in every `spacing` rows of the coast,
; with this chance, its middle `out` tiles seaward of the coast line; a ring of salt marsh around
; it keeps the mud and the tideways off.
spacing=150
chance=0.7
out=11

[ewers]
; An Ewer (a flat-bottomed sailing barge) lies on the mud in one in every `spacing` rows of the
; coast, with this chance, from `out_from` to `out_to` tiles seaward of the coast line; none where
; its tiles (see its footprint) would not all be mud.
spacing=70
chance=0.6
out_from=22
out_to=60

[ditches]
; Beside a ditch in the marsh: the chance of a pollard willow on a tile, and of reeds.
willow_chance=0.1
reeds_chance=0.3
