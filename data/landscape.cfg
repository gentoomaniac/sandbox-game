; The marsh, the woods, the creeks, the dykes and the coast the world generator lays over the
; terrain. Hand-editable; read once when the game starts (see game/state/landscape_rules.gd).
; Sizes are in tiles, chances and shares from 0 to 1.
;
; The open land has no fields, fences, hedges, walls or ditches: those come with the villages, and
; the player digs ditches. In the west the land ends at the North Sea: a sea dyke runs along the
; coast, and beyond it lie the salt marsh, the tidal mud with its tideways, and the open sea.

[marsh]
; How far from the floodplain's edge, and from the sea dyke, the marsh reaches: the low land by the
; river and the coast, where wet-ground trees grow.
reach=36

[woods]
; A wood is where the forest noise (-1 to 1) is above `above` (0.27 makes about 15 % of the Geest
; wood), read at a position pushed up to `warp` tiles by a second noise, so the outline is no
; contour line. `core_above` is where the core begins: depth 0 at the edge, 1 at the core. There
; are no woods in the marsh. A tile of a wood holds a trunk with the chance `edge_trees` at the
; edge and `core_trees` at the core (keep it near 0.6 at most, so a walker gets through).
; Clearings (no trees) are cut where a fine noise is above `clearing_above`.
above=0.27
core_above=0.38
warp=8
clearing_above=0.55
edge_trees=0.15
core_trees=0.55

[creeks]
; Natural creeks come down to the river. The land is cut into bands `spacing` tiles wide along x;
; each band has a creek with this `chance`, which runs from the river north or south for a length
; between `min_length` and `max_length`, from a small wetland (its source) down to the river, in
; S-bends of about 35 tiles that swing up to `meander` tiles either side of the band's middle. A
; ford (shallow ground to walk over, a round patch about three tiles across) lies once in every
; `ford_spacing` rows along it. Twice the meander and the source must stay below the spacing, so a
; creek stays in its band.
; A band whose creek could come within 4 tiles of the coast line has none.
spacing=160
chance=0.6
meander=22
min_length=50
max_length=130
ford_spacing=36

[dykes]
; Dykes run along the floodplain's edge, on the land side, in stretches: where a slow noise
; along the river is above this (-1 to 1; lower means more dyke).
stretch_above=-0.3

[coast]
; The coast line runs north to south, wandering: the land lies east of it, the first tiles of land
; carry the sea dyke. line_x is where it runs on average (a world x; the world spans -1024 to
; 1023), and it wanders up to `wander` tiles east and west of that.
line_x=-260
wander=40
; West of the dyke: the salt marsh, `salt_marsh_width` tiles wide on average, give or take
; `salt_marsh_wander`; then the tidal mud, out to `flats_width` tiles from the salt marsh on
; average (give or take a third of it); then the open sea.
salt_marsh_width=12
salt_marsh_wander=5
flats_width=140

[tideways]
; Tideways (Priele) wind through the mud out to the sea, one in every `spacing` tiles from north
; to south, each up to `meander` tiles either side of its middle. They start a tile wide at the
; salt marsh, or a little further out, and widen by `widening` tiles per tile out to `widest`.
; Twice the meander and the widest must stay below the spacing, so they never run together.
spacing=36
meander=11
widening=0.06
widest=7

[warften]
; A Warft (dwelling mound) stands out on the salt marsh in one in every `spacing` rows of the coast,
; with this chance, its middle `out` tiles seaward of the coast line; a ring of salt marsh around
; it keeps the mud and the tideways off.
spacing=150
chance=0.7
out=11

[ewers]
; An Ewer (a flat-bottomed sailing barge) lies on the mud in one in every `spacing` rows of the
; coast, with this chance, from `out_from` to `out_to` tiles seaward of the coast line; none where
; its tiles (see its footprint) would not all be mud.
spacing=70
chance=0.6
out_from=22
out_to=60

[surge]
; The height of the land, in metres over mean high water (see game/state/elevation.gd), which the
; storm surge's flood is measured against (design/world/storm-surge.md). A terrain with a number
; here has it; grass and soil stand `land_at_dyke` at the sea dyke and rise `land_rise` metres per
; tile inland up to `land_top` (the Geest), so the first 36 tiles behind the dyke (the marsh's
; reach, the Koog) are the lowest dry land. A slow noise of up to `noise` metres either way, one
; swell `noise_size` tiles across, gives the flood a shape; a finer one of up to `fine_noise`
; metres, `fine_noise_size` tiles across, makes the edge of the water wander instead of running
; straight where the land rises evenly.
mud=0.0
salt_marsh=0.8
wetland=0.8
floodplain=1.0
warft=3.6
land_at_dyke=1.2
land_rise=0.02
land_top=4.0
noise=0.3
noise_size=40
fine_noise=0.15
fine_noise_size=7

; The dykes' own height (metres over mean high water) and strength (0 bare to 1 well turfed and
; packed; see game/state/dyke_profile.gd). A stretch of `dyke_stretch_size` tiles shares one value:
; the sea dyke is `sea_dyke_height` give or take `sea_dyke_spread`, the river dykes (which a surge
; of the sea never reaches) `river_dyke_height` give or take `river_dyke_spread`, and the strength
; is `dyke_strength` give or take `dyke_strength_spread`. A dyke under `low_below` is called low
; and one over `high_above` high.
sea_dyke_height=2.0
sea_dyke_spread=1.5
river_dyke_height=1.0
river_dyke_spread=0.3
dyke_strength=0.6
dyke_strength_spread=0.2
dyke_stretch_size=60
low_below=1.5
high_above=2.8

; The flood (see game/state/flood_state.gd). Where the sea runs over a dyke (its height under the
; water's level) the dyke breaks down to `breach_height` metres; a dyke that holds is damaged when
; the level comes within `damage_margin` metres times its weakness (1 minus the strength) of its
; top, and loses `damage_height` metres times its weakness. Villagers mend a damaged stretch
; of the generated dykes after `repair_days`. From each breach the water fills the land lower than
; its level, `fill_tiles_per_second` tiles a second (at most `fill_tiles_per_step` in a frame),
; until `volume_per_breach` tile-metres (tiles times depth) are filled for each breach. It stands
; `stay_hours` give or take `stay_spread_hours`, then drains at the same speed. Water deeper than
; `wade_depth` metres can't be walked on, only waded. A tile that stood under the sea carries
; `salt_days` days of salt (it spoils a field; each day takes one off, and each hour of rain
; another) and is muddy for `mud_days` days after it dried. A seedling under water dies at once, any
; other crop when it has stood deeper than `crop_depth` metres for `crop_hours` hours. Items lying
; on ground under more than `wash_depth` metres drift inland up to `wash_tiles` tiles, and with the
; chance `item_loss_chance` are lost.
breach_height=0.3
damage_margin=0.5
damage_height=0.3
repair_days=6
fill_tiles_per_second=60
fill_tiles_per_step=300
volume_per_breach=4000
stay_hours=30
stay_spread_hours=12
wade_depth=0.35
salt_days=40
mud_days=3
crop_depth=0.1
crop_hours=24
wash_depth=0.5
wash_tiles=3
item_loss_chance=0.3
