; Wild seeds: what picking a plant by hand may also give, besides its drops (design/farming/crops.md,
; #11). Hand-editable; read once when the game starts (see game/state/wild_seeds.gd, which also
; reports what is wrong with the file). A pick that finds one gives one seed item, which plants one
; tile.
;
; One section for each seed a plant may give, named [<plant>.<seed>]:
; - <plant> is a world object type picked by hand (a bush, not a tree or a crop): berry_bush,
;   shrub, fern_bush. It can only be picked while it is there, so a season it is not in needs no
;   entry.
; - <seed> is the seed item of a crop (the `seed` of data/crops.cfg).
; - seasons: the seasons in which it can be found ("spring", "summer", "autumn" or "winter").
; - chance: above 0 up to 1, in steps of 0.01: how likely a pick of that plant on that day
;   is to find it. The same plant on the same day always finds the same (as the seeds of felled
;   trees do), the other days roll again, and each seed of a plant rolls for itself.
;
; Roots, grains, peas, beans and flax a hand can find; the garden crops (potato, cabbage, wheat,
; pumpkin) are bred and bought from Trienke Lorenzen's stall (data/shops.cfg), as is any other seed.

[shrub.turnip_seeds]
seasons=["spring", "autumn"]
chance=0.10

[shrub.flax_seeds]
seasons=["spring"]
chance=0.10

[shrub.rye_seeds]
seasons=["autumn"]
chance=0.10

[fern_bush.peas_seeds]
seasons=["spring"]
chance=0.10

[fern_bush.carrot_seeds]
seasons=["spring", "summer"]
chance=0.10

[fern_bush.beans_seeds]
seasons=["summer"]
chance=0.10

[berry_bush.strawberries_seeds]
seasons=["summer"]
chance=0.15

[berry_bush.buckwheat_seeds]
seasons=["summer", "autumn"]
chance=0.10

[berry_bush.onion_seeds]
seasons=["autumn"]
chance=0.10
