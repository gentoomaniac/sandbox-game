; Recipes: what the crafting menu can make. Hand-editable; read once when the game starts (see
; game/state/recipe_rules.gd). A new recipe is a new section here, for an item that exists in
; ItemTypes: no code. The menu lists the recipes in the order of this file.
;
; Every section is named after the recipe (an id the menu uses) and has all of:
;   result      The item id it makes (an id of ItemTypes).
;   count       How many of it one crafting gives, at least 1.
;   materials   What one crafting takes from the inventory: a dictionary of item id to how
;               many, with at least one entry.
; and may have:
;   station     Where it is made: a station of stations.cfg, whose menu (E on it) lists it.
;               Without one it is made by hand, in the menu that C opens.
;   skill       The skill of skills.cfg that making it practises (see there for how much).
;   level       The points of `skill` it needs, 0 if not given. The menu shows a recipe the
;               player lacks the points for, locked, with what it needs.
;   hours       The game hours it takes (it needs a station): the materials go into the station,
;               which holds them until the time is up, also while the player is away, and then
;               gives the result when its menu is opened. One at a time per station (the kiln).

[chest]
result="chest"
count=1
materials={"logs": 5}

[workbench]
result="workbench"
count=1
materials={"logs": 6}

[kiln]
result="kiln"
count=1
materials={"clay": 6, "stone": 8}

; Woodworking at the workbench.

[planks]
result="planks"
count=2
materials={"logs": 1}
station="workbench"
skill="woodworking"

[stool]
result="stool"
count=1
materials={"planks": 3}
station="workbench"
skill="woodworking"
level=10

[clogs]
result="clogs"
count=1
materials={"logs": 1}
station="workbench"
skill="woodworking"
level=25

[carved_chest]
result="carved_chest"
count=1
materials={"planks": 8}
station="workbench"
skill="woodworking"
level=45

; Masonry: bricks are moulded at the workbench and fired in the kiln, with logs for the fire.

[raw_bricks]
result="raw_brick"
count=2
materials={"clay": 2}
station="workbench"
skill="masonry"

[raw_bricks_true]
; A practised hand fills the mould better and wastes less clay.
result="raw_brick"
count=3
materials={"clay": 2}
station="workbench"
skill="masonry"
level=25

[bricks]
result="brick"
count=6
materials={"raw_brick": 6, "logs": 2}
station="kiln"
skill="masonry"
hours=12

[bricks_large]
; A skilled mason stacks a bigger load that fires as well.
result="brick"
count=12
materials={"raw_brick": 12, "logs": 3}
station="kiln"
skill="masonry"
level=50
hours=12

; Cooking at the hearth or the campfire.

[roast_turnip]
result="roast_turnip"
count=1
