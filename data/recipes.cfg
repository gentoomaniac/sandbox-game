; Recipes: what the crafting menu (C) can make. Hand-editable; read once when the game starts
; (see game/state/recipe_rules.gd). A new recipe is a new section here, for an item that exists
; in ItemTypes: no code. The menu lists the recipes in the order of this file.
;
; Every section is named after the recipe (an id the menu uses) and has all of:
;   result      The item id it makes (an id of ItemTypes).
;   count       How many of it one crafting gives, at least 1.
;   materials   What one crafting takes from the inventory: a dictionary of item id to how
;               many, with at least one entry.

[chest]
result="chest"
count=1
materials={"logs": 5}
