station="hearth"
skill="cooking"

[pottage]
result="pottage"
count=2
materials={"cabbage": 1, "carrot": 1, "onion": 1}
station="hearth"
skill="cooking"
level=10

[pea_soup]
result="pea_soup"
count=2
materials={"peas": 4, "onion": 1}
station="hearth"
skill="cooking"
level=20
