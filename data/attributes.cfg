; Attributes: the numbers that make the character stronger or weaker (task 187). Hand-editable;
; read once when the game starts (see game/state/attribute_rules.gd). The character window (C)
; lists them in the order of this file.
;
; An attribute is a level. A new character has every attribute at its `base`, and the numbers in
; [effects] are chosen so that the base levels give the numbers the game had before attributes:
; 100 energy, 100 health and 40 kilograms carried before the load costs more energy.
;
; [levels] and [effects] hold the rules all attributes share. Every other section is an
; attribute, named after its id, with:
;   name         What the player reads.
;   description  One line about it, for its tooltip.
;   base         The level of a new character.

[levels]
; The lowest and highest level an attribute can have (the console's `attribute` keeps within them).
min=1
max=100

[effects]
; What one level of an attribute gives.
; Stamina: the most energy the player can have.
energy_per_stamina=10.0
; HP: the most health the player can have.
health_per_hp=10.0
; Strength: the kilograms carried before the load costs more energy (see [weight] in energy.cfg).
; Nothing is ever refused for being too heavy.
free_kg_per_strength=4.0

[strength]
name="Strength"
description="How much you carry before the load tires you."
base=10

[agility]
name="Agility"
description="Has no effect yet."
base=10

[stamina]
name="Stamina"
description="How much energy you have at most."
base=10

[hp]
name="HP"
description="How much health you have at most."
base=10
