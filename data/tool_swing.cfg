; How the player swings a tool (issue 13): hand-editable, read once when the game starts (see
; game/state/tool_swing_rules.gd). One section per motion, in the order of the columns in the swing
; sheets (assets/character/use/, drawn by tools/art/tool_swing.py: change the frames there and
; here together). A motion has:
; - tools: the kinds of tool that make it;
; - frame_ms: how long each frame shows, in milliseconds, one number per frame of the sheet. The
;   whole swing lasts their sum, and the player can't use anything again before it is over
;   (holding the use key swings again at once). These are the artist's start: tune them here;
; - strike_frame: the frame (counted from 0) where the blow lands. The tile changes, the energy is
;   spent and the sound plays when this frame begins.

[chop]
tools=["axe", "pickaxe", "hoe"]
frame_ms=[100, 160, 70, 180, 120]
strike_frame=3

[knock]
tools=["hammer"]
frame_ms=[90, 140, 60, 160, 110]
strike_frame=3

[dig]
tools=["shovel"]
frame_ms=[130, 220, 150, 200]
strike_frame=3

[mow]
tools=["scythe"]
frame_ms=[130, 90, 70, 90, 150]
strike_frame=2

[pour]
tools=["watering_can"]
frame_ms=[120, 110, 180, 180]
strike_frame=2
