; The five grades of every tool (task 207): hand-editable, read once when the game starts (see
; game/state/tool_grade_rules.gd). The sections run from the worst grade to the best, and each
; one makes a tool item of the grade from each of the seven tools (hoe, axe, ...): "<name> <tool>"
; as its name ("Iron hoe"), "<id>_<tool>" as its id (iron_hoe).
; Every number works for all the tools of the grade:
; - name: what the player reads before the tool;
; - numeral: the Roman numeral the inventory slot draws on the tool, I for the worst grade (the
;   slot has a picture of each numeral from I to V: see SlotView);
; - level: how good it is, from 0 to 3. A tree or stone needs a tool of its `harvest_level` or
;   better (see WorldObjectTypes): the pine and the boulders need 2;
; - power: the hit points one hit of an axe or pickaxe takes off (a tree has 3 to 7, a stone 3
;   to 6): the better the grade, the fewer the hits;
; - energy_factor: what every use of the tool costs in energy, as a share of the cost in
;   energy.cfg: a better tool tires less.
; There is no durability in the game, so brittle steel does not chip: it hits as hard as steel
; but is no lighter on the energy than iron. When tools wear out, it should chip.

[rusty_iron]
name="Rusty iron"
numeral="I"
level=1
power=1
energy_factor=1.0

[iron]
name="Iron"
numeral="II"
level=2
power=2
energy_factor=0.95

[brittle_steel]
name="Brittle steel"
numeral="III"
level=2
power=3
energy_factor=0.95

[steel]
name="Steel"
numeral="IV"
level=3
power=3
energy_factor=0.85

[sharp_steel]
name="Sharp steel"
numeral="V"
level=3
power=4
energy_factor=0.75
