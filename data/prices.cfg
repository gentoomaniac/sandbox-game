; What a thing is worth, in whole Schilling (design/economy/README.md). Read once when the game
; starts (see game/state/prices.gd, which also reports what is wrong with the file). One table
; for every shop, and later for barter and the player's stall.
;
; [worth]: an item of the game (game/state/item_types.gd) and what it is worth, a whole number from
; 1. An item with no worth can't be traded. A good a shop takes must be worth at least 2: it
; takes at 60 percent, rounded down, and 60 percent of 1 is 0, so she would take it for nothing
; (data/shops.cfg).
;
; [kind]: the goods whose worth changes with the season, each with a kind of [seasons.<kind>]. A good
; with no kind is flat: seeds, candles, wood, fibre, reeds, hay, clay (and later salt, nails and
; cloth).
;
; [seasons.<kind>]: spring, summer, autumn and winter, the percent of its worth a good of the kind is
; worth in that season (a whole number from 1). The worth is changed first, rounded to the nearest
; whole (never below 1, and 2 for a good a shop takes), and the shop makes its price or value of
; that, so the percentages are applied once. A season is 35 days. Cheap goods hardly move: 2 at 120
; percent is 2.4, which rounds back to 2.
;
; [purse]: start, the Schilling the player has in a new game, a whole number from 0. 32 buys the ten
; turnip seeds the first quest gives (3 each) and leaves 2.

[worth]
turnip_seeds=2
potato_seeds=4
carrot_seeds=2
cabbage_seeds=3
onion_seeds=2
wheat_seeds=2
rye_seeds=2
buckwheat_seeds=2
peas_seeds=3
beans_seeds=3
flax_seeds=2
strawberries_seeds=5
pumpkin_seeds=4
candle=16
egg=2
berries=3
turnip=6
fibre=3
reeds=3
hay=3
logs=8
clay=4
flour=10
bread=12

[kind]
flour="grain"
bread="grain"
egg="farm"
turnip="vegetable"
berries="vegetable"

; Grain is cheap after the harvest and dear in spring; eggs are dearer in winter, when the hens lay
; less; fresh vegetables are cheap in their season and dear out of it.
[seasons.grain]
spring=120
summer=100
autumn=80
winter=100

[seasons.farm]
spring=100
summer=90
autumn=100
winter=120

[seasons.vegetable]
spring=130
summer=100
autumn=80
winter=130

[purse]
start=32
