; for every shop, and later for barter and the player's stall.
;
; [worth]: an item of the game (game/state/item_types.gd) and what it is worth, a whole number from
; 1. An item with no worth can't be traded. A good a shop takes must be worth at least 2: it
; takes at 60 percent, rounded down, and 60 percent of 1 is 0, so she would take it for nothing
; (data/shops.cfg).

