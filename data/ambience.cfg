; Ambience: when the weather and the animals make their sounds. Hand-editable; read once when the
; game starts (see game/state/ambience_rules.gd and game/scenes/ambience_sounds.gd). Which files
; play is data/sounds.cfg's business; this is about how often, how loud and where.
;
; Lists of factors are indexed by season (spring, summer, autumn, winter) or by part of the day
; (day, dawn and dusk, night). A chance is per second; a level is a loop's share of its full
; volume, 0 to 1.

[loops]
; Rain is as loud as the rain is strong, up to this level.
rain_max_level=0.9
; The wind loop is silent up to the calm speed and at `wind_max_level` from the full speed on,
; both in m/s.
wind_calm_speed=3.0
wind_full_speed=14.0
wind_max_level=0.7
; A loop quieter than this is stopped; it fades in and out over `fade_seconds` as the weather
; changes (the visuals fade too).
min_level=0.02
fade_seconds=3.0
; A gust is heard when a gust front (the ones the plants sway in, see AmbientMotion.gust_front)
; reaches the player, once its brightness (0 to 1) rises past `gust_front_from`. It plays wind_gust
; at `gust_soft_level` of its volume where gusts only begin to show (above `wind_calm_speed`,
; AmbientMotion.GUSTS_FROM) and rises to full in a storm, and swells the wind loop by up to
; `gust_swell` for `gust_seconds`, rising and falling over `gust_fade_seconds`. No gusts below
; the speed where the plants show them. Indoors the Ambience bus turns them down, see [indoors].
gust_front_from=0.5
gust_soft_level=0.15
gust_swell=0.3
gust_seconds=2.5
gust_fade_seconds=0.8

[indoors]
; Inside a building the weather and the world outside are faint as well as muffled (the low-pass
; of AudioService): the Ambience and OutsideEffects buses are turned down by this many dB, fading
; in and out with the muffle.
outside_db=-24.0
; A fire in the room (a hearth or a fireplace) crackles from the fire itself, as a sound effect near
; it on top of the rest, at `fire_level` (a share of the loop's full volume, 0 to 1) beside it and
; fading out with the distance to the reach. A room of at most `fire_small_room_tiles` tiles (its
; whole map, walls included: Kate's is 72, the longhouse's 120) is small, and the crackle reaches
; `fire_small_reach_tiles` from the fire: all of such a room. A bigger room is too big to hear the
; fire from its door, and it reaches only `fire_big_reach_tiles` (the longhouse's door is 4.3 tiles
; from its fire, the hall house's 8.5). It fades in and out over `fire_fade_seconds` as the player
; enters and leaves.
fire_level=0.8
fire_small_room_tiles=100
fire_small_reach_tiles=9.0
fire_big_reach_tiles=4.0
fire_fade_seconds=0.6

[paused]
; While the game is paused (the pause menu, a chat) the sounds of the game go quiet and come back
; over this many seconds, so it doesn't click. The music and the menu's own sounds go on.
fade_seconds=0.3

[birds]
; The chance per second at full activity that a bird chirps near the player, within `radius_tiles`
; of them (from a bird in view, else from one of the trees found by looking at `tries` tiles).
chirp_chance=0.12
radius_tiles=14
tries=8
season_factors=[1.0, 1.0, 0.6, 0.15]
phase_weights=[1.0, 0.7, 0.0]
; Birds fall silent as the rain grows towards this strength.
rain_limit=0.6

[frogs]
; The chance per second at full activity that a frog croaks at the nearest water among the `tries`
; tiles looked at within `radius_tiles` of the player. The nearer the water the more often: the
; chance falls to nothing at the radius.
croak_chance=0.4
radius_tiles=12
tries=40
season_factors=[1.0, 1.0, 0.25, 0.0]
phase_weights=[0.1, 0.6, 1.0]
; Frogs are silent below `cold_temperature` and at their liveliest from `warm_temperature`, in °C.
cold_temperature=4.0
warm_temperature=16.0

[frog_chorus]
; Frogs croaking together on spring and summer evenings: a quiet loop that swells with the frogs
; about (see data/wildlife.cfg, [frog]), at `level` with `full_frogs` of them or more, as warm as
; the croaks of [frogs] need it, and fades in and out over `fade_seconds`.
level=0.6
full_frogs=3
fade_seconds=8.0
season_factors=[1.0, 1.0, 0.0, 0.0]
phase_weights=[0.0, 1.0, 0.5]

[deer]
; The chance per second that a deer in view makes its sound while it goes about its day.
idle_chance=0.02

[rabbit]
idle_chance=0.01

[squirrel]
idle_chance=0.03

; A flock of geese honks now and then, grazing or flying over. (The storks' clatter goes with
; their clattering, see game/scenes/wildlife/stork.gd.)
[geese]
idle_chance=0.02

[flying_geese]
idle_chance=0.15

; The farm animals call rarely: a moo, a baa or a cluck now and then (a tame rabbit is a rabbit).
[cow]
idle_chance=0.015

[sheep]
idle_chance=0.015

[chicken]
idle_chance=0.02

; A dog barks now and then, a cat only rarely meows, a horse whinnies or snorts.
[dog]
idle_chance=0.02

[cat]
idle_chance=0.004

[horse]
idle_chance=0.01

[bees]
; Bees that buzz at once (the nearest ones, so the loops stay few) and how loud.
max_loops=2
level=0.5
; Bees are heard only this close (in tiles); the buzz fades out towards it.
hear_tiles=4.0
