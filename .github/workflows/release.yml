# Builds the Linux and Windows releases when a version tag is pushed (see docs/development.md, "Releases"):
#   git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag filter above is a glob, so `v1.2.3-rc1` or `v1.x.3` get here too.
      - name: Check the tag is vX.Y.Z
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag '$TAG' is not of the form vX.Y.Z."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Read the pinned Godot version
        run: echo "GODOT_VERSION=$(cat .godot-version)" >> "$GITHUB_ENV"

      - name: Cache Godot and its export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and its export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSLO "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSLO "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d ~/godot
          chmod +x ~/godot/*
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          unzip -j -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            templates/version.txt templates/linux_release.x86_64 templates/windows_release_x86_64.exe \
            -d "$templates"

      - name: Build the assets
        run: make assets

      - name: Export Linux and Windows
        run: make export GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 VERSION=${GITHUB_REF_NAME#v}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/export/*.zip --title "$GITHUB_REF_NAME" --generate-notes
